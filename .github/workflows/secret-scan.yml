# 비밀(키·토큰) 유출 검사 — gitleaks 공식 릴리스 바이너리를 체크섬으로 확인한 뒤 실행한다.
#
# - push / pull_request: 이번에 새로 들어온 커밋만 검사한다 (새 유출을 막는 문지기).
# - workflow_dispatch (Actions 탭에서 수동 실행): 전체 히스토리 + 현재 파일 전체를 검사한다 (정기 점검용).
#   과거에 이미 공개된 키가 있으면 여기서 실패한다. 그 키를 폐기한 뒤에만 .gitleaksignore 에 지문을 적는다.
#
# 발견된 값은 로그에 찍지 않는다 (--redact).
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Pick commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request)
              range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_BEFORE}..${GITHUB_SHA}"
              elif [ -n "$(git rev-list "origin/${DEFAULT_BRANCH}..${GITHUB_SHA}" 2>/dev/null)" ]; then
                range="origin/${DEFAULT_BRANCH}..${GITHUB_SHA}"   # 새 브랜치: 기본 브랜치에 없는 커밋만
              else
                range="${GITHUB_SHA}^!"                            # 그 밖(강제 push 등): 마지막 커밋만
              fi ;;
            *)
              range="" ;;                                          # 수동 실행: 전체 히스토리
          esac
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "검사 범위: ${range:-전체 히스토리}"

      - name: Scan commits
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          if [ -n "$RANGE" ]; then
            gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose --log-opts="$RANGE"
          else
            gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
          fi

      - name: Scan current files (manual full audit only)
        if: github.event_name == 'workflow_dispatch'
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose
