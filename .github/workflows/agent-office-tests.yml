# Agent Office 테스트 — main 으로 가는 push·PR 중 Agent Office 와 관련된 것만 전체 pytest 를 돌린다.
# 테스트는 API 키·네트워크 없이 돈다 (tests/conftest.py 가 LLM·웹 검색·시세 호출을 모두 가짜로 바꾼다).
#
# 부하에 민감한 테스트(.github/ci/agent-office-load-sensitive.txt):
#   OR-Tools 평면도 배치(CP-SAT, 시간·작업량 제한 안에서 찾은 답의 품질을 검사)와
#   스레드 동시 실행·시간 제한 테스트(실제 시간을 잰다)는 러너 CPU 가 바쁘면 가끔 실패한다.
#   검사 내용은 그대로 두고, 전체 실행에서 빼서 '하나씩, 새 프로세스로, 최대 3번' 따로 돌린다.
#   3번 모두 실패하면 CI 는 실패한다 (진짜 회귀는 그대로 잡힌다).
#   새 프로세스로 돌리는 까닭: 평면도 후보는 module 범위 fixture 로 한 번만 만들기 때문에,
#   같은 프로세스 안에서 다시 돌리면 바쁠 때 만든 결과를 그대로 다시 쓴다.
name: agent-office-tests

# Agent Office 코드·이 워크플로·CI 목록이 바뀔 때만 돈다 (다른 프로젝트·문서만 바뀐 push 는 건너뛴다).
on:
  push:
    branches: [main]
    paths:
      - "LLM/Agent_office/**"
      - ".github/workflows/agent-office-tests.yml"
      - ".github/ci/agent-office-load-sensitive.txt"
  pull_request:
    branches: [main]
    paths:
      - "LLM/Agent_office/**"
      - ".github/workflows/agent-office-tests.yml"
      - ".github/ci/agent-office-load-sensitive.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-office-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: LLM/Agent_office
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      LOAD_SENSITIVE_LIST: ${{ github.workspace }}/.github/ci/agent-office-load-sensitive.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            LLM/Agent_office/requirements.txt
            LLM/Agent_office/requirements-dev.txt

      # 평면도 라벨은 한글 글자 폭을 재서 방 안에 맞춘다. 러너(Ubuntu)에는 한글 글꼴이 없어 실제 사용(맑은 고딕)과 같게 나눔고딕을 깐다.
      # (글꼴이 없을 때도 멈추지 않는지는 tests/test_floorplan_render.py::test_renders_without_korean_font 가 따로 본다)
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-nanum

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests (load-sensitive ones deselected)
        run: |
          set -euo pipefail
          deselect=()
          # tr: 목록이 CRLF 로 커밋돼도 node id 끝에 \r 이 붙어 '빼기'가 조용히 무시되지 않게
          while read -r node; do deselect+=(--deselect "$node"); done < <(tr -d '\r' < "$LOAD_SENSITIVE_LIST" | grep -vE '^[[:space:]]*(#|$)')
          python -m pytest -q -p no:cacheprovider -rfE "${deselect[@]}"

      - name: Run load-sensitive tests one by one (up to 3 tries, fresh process each)
        run: |
          set -uo pipefail
          failed=0
          while read -r node; do
            for attempt in 1 2 3; do
              if python -m pytest -q -p no:cacheprovider "$node"; then
                [ "$attempt" -gt 1 ] && echo "::warning::$node passed on try $attempt (load-sensitive)"
                continue 2
              fi
            done
            echo "::error::$node failed 3 times"
            failed=1
          done < <(tr -d '\r' < "$LOAD_SENSITIVE_LIST" | grep -vE '^[[:space:]]*(#|$)')
          exit "$failed"
