# 의존성 보안 업데이트 — 매주 한 번 확인하고, 한 번에 여는 PR 수는 작게 둔다.
# PR 은 자동으로 합치지 않는다. Agent Office 테스트(CI)가 통과한 것만 직접 검토해서 합친다.
version: 2
updates:
  - package-ecosystem: pip
    directory: /LLM/Agent_office
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # 작은 버전(패치·마이너) 올림은 PR 하나로 묶어 리뷰 부담을 줄인다
      agent-office-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /GAME/Soccer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
