<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  🏢 픽셀 사무실 · 🏙 픽셀 빌딩 — Streamlit 양방향 컴포넌트 (외부 라이브러리·이미지 없음, 모든 그림은 코드가 직접 그린다)
  - pixel.js    : 공용 그림 (캐릭터·화분·색)
  - office.js   : 팀 화면의 사무실 (office_ui.py, 스냅샷 core/office.py)
  - building.js : 메인 화면의 빌딩 (building_ui.py, 스냅샷 core/building.py) — 스냅샷 kind 가 "building" 일 때
  - 파이썬이 보내는 스냅샷(args.snapshot)이 바뀌어도 iframe 을 다시 만들지 않으므로 움직임이 끊기지 않는다.
  - 통신은 Streamlit 컴포넌트 규약(postMessage: componentReady / render / setComponentValue / setFrameHeight)을 직접 쓴다.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; width: 100%; border-radius: 10px; }
  #tip { position: absolute; display: none; pointer-events: none; max-width: 260px; padding: 6px 9px; border-radius: 6px;
         background: #fdf6e3; color: #2b2b2b; border: 2px solid #2b2b2b; font-size: 12px; line-height: 1.45;
         box-shadow: 3px 3px 0 rgba(0,0,0,.35); white-space: pre-line; z-index: 2; }
  #tip b { font-size: 13px; }
  /* 빌딩: 팀 요약 카드 */
  #tip.card { max-width: 320px; white-space: normal; padding: 0; overflow: hidden; }
  #tip.card .hd { padding: 6px 10px; color: #fff; font-weight: bold; font-size: 13px; }
  #tip.card .hd small { display: block; font-weight: normal; opacity: .9; font-size: 11px; }
  #tip.card .bd { padding: 6px 10px 8px; }
  #tip.card .row { margin-top: 4px; }
  #tip.card .k { color: #6b5a3a; font-weight: bold; margin-right: 4px; }
  #tip.card .chips span { display: inline-block; margin: 2px 3px 0 0; padding: 0 5px; border-radius: 4px; background: #efe6cf; font-size: 11px; }
  #tip.card .st { font-weight: bold; }
  #tip.card .foot { margin-top: 6px; color: #8a7a5a; font-size: 11px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="tip"></div></div>
<script src="pixel.js"></script>
<script>
"use strict";
// 불러오기: 첫 스냅샷의 kind 로 office.js / building.js 중 하나만 읽는다. 그 파일이 AO.onSnapshot 을 정한다.
window.AO = {
  send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*"); },
  onSnapshot: null,
};
let pendingSnap = null, loadingView = false;
window.addEventListener("message", (e) => {
  if (!(e.data && e.data.type === "streamlit:render")) return;
  const s = e.data.args.snapshot;
  if (AO.onSnapshot) { AO.onSnapshot(s); return; }
  pendingSnap = s;
  if (loadingView || !s) return;
  loadingView = true;
  const el = document.createElement("script");
  el.src = s.kind === "building" ? "building.js" : "office.js";
  el.onload = () => { if (AO.onSnapshot && pendingSnap) AO.onSnapshot(pendingSnap); pendingSnap = null; };
  document.body.appendChild(el);
});
AO.send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
