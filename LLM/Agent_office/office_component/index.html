<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  🏢 픽셀 사무실 — Streamlit 양방향 컴포넌트 (외부 라이브러리·이미지 없음, 모든 그림은 아래 코드가 직접 그린다)
  - 파이썬(office_ui.py)이 보내는 스냅샷(args.snapshot)을 받아 그린다. 스냅샷이 바뀌어도 iframe 을 다시 만들지 않으므로
    걷기·쪽지 애니메이션이 끊기지 않는다.
  - 캐릭터를 누르면 {id, t} 를 파이썬으로 돌려준다 → 아래 에이전트 패널이 열린다.
  - 통신은 Streamlit 컴포넌트 규약(postMessage: componentReady / render / setComponentValue / setFrameHeight)을 직접 쓴다.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; width: 100%; border-radius: 10px; }
  #tip { position: absolute; display: none; pointer-events: none; max-width: 260px; padding: 6px 9px; border-radius: 6px;
         background: #fdf6e3; color: #2b2b2b; border: 2px solid #2b2b2b; font-size: 12px; line-height: 1.45;
         box-shadow: 3px 3px 0 rgba(0,0,0,.35); white-space: pre-line; z-index: 2; }
  #tip b { font-size: 13px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="tip"></div></div>
<script>
"use strict";
const T = 16;                                   // 타일 크기 (세계 좌표 px)
const cv = document.getElementById("c"), g = cv.getContext("2d");
const tip = document.getElementById("tip");
const world = document.createElement("canvas"), w = world.getContext("2d");  // 세계 해상도 픽셀 층
let bg = null, L = null, snap = null, grid = null, layoutKey = "";
let scale = 1, lastH = 0, hoverId = null;
const agents = {};                              // id → {x, y, path, dir, d(스냅샷 항목), step}
const seen = new Set();
let firstRender = true;
const mails = [];                               // 날아가는 쪽지
const pops = [];                                // 도착 표시 (✉️ 떠오름)

// ── Streamlit 규약 ─────────────────────────────────────────────
function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*"); }
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render") onSnapshot(e.data.args.snapshot);
});
send("streamlit:componentReady", { apiVersion: 1 });

// ── 색 ────────────────────────────────────────────────────────
const FLOORS = { lead: ["#a77b4f", "#9c7148"], meeting: ["#6f7d99", "#687590"], library: ["#93704c", "#8a6946"],
                 lounge: ["#7f946c", "#778b65"], floor: ["#5d7771", "#56706a"] };
const SKIN = ["#f1c27d", "#e0ac69", "#c68642", "#ffdbac", "#a8724a"];
const HAIR = ["#2c1b10", "#4a3020", "#1b1b1b", "#7a4a1e", "#b8860b", "#5a5a5a", "#a0522d", "#3d2b56"];
const PANTS = ["#2f3542", "#3b3b58", "#4b4b4b", "#2d3e50"];
const BUBBLE = {  // tone → [배경, 테두리, 글자]
  working: ["#ffffff", "#f08a24", "#222"], wait: ["#eceef2", "#6b7280", "#333"], done: ["#e3fcef", "#2f855a", "#14532d"],
  revise: ["#deebff", "#2b6cb0", "#1e3a8a"], idle: ["rgba(255,255,255,.82)", "#9aa0a6", "#555"],
  blocked: ["#ffe4e4", "#d33", "#9b1c1c"], error: ["#ffd6d6", "#c00", "#7f1d1d"], out: ["rgba(255,255,255,.6)", "#bbb", "#888"],
};
const SEAL = { ask: "#2b6cb0", delegate: "#d33", report: "#2f855a" };

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rect(c, x, y, ww, hh, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), ww, hh); }

// ── 배경 (방 바닥·벽·창문·러그·화이트보드) — 배치가 바뀔 때만 한 번 그린다 ─────────
function drawBackground() {
  bg = document.createElement("canvas");
  bg.width = L.w * T; bg.height = L.h * T;
  const b = bg.getContext("2d");
  rect(b, 0, 0, bg.width, bg.height, "#1f1c26");
  for (const r of L.rooms) {
    const [a, c2] = FLOORS[r.kind] || FLOORS.floor;
    const wood = r.kind === "lead" || r.kind === "library";
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) {
      rect(b, x * T, y * T, T, T, (x + y) % 2 ? a : c2);
      if (wood) { rect(b, x * T, y * T + 7, T, 1, "rgba(0,0,0,.12)"); rect(b, x * T + ((y % 2) ? 5 : 11), y * T, 1, 7, "rgba(0,0,0,.10)"); }
      else rect(b, x * T, y * T, T, 1, "rgba(255,255,255,.05)");
    }
  }
  // 방 사이 복도(벽 아래 줄)·문턱도 바닥으로
  for (let x = 1; x < L.w - 1; x++) rect(b, x * T, 8 * T, T, T, FLOORS.floor[x % 2]);
  // 벽: 위 덮개(어두움) + 앞면(베이지)
  for (const [x, y, ww, hh] of L.walls) {
    rect(b, x * T, y * T, ww * T, hh * T, "#3b3547");
    if (ww > hh || (y === 0 && hh === 2)) {
      const capH = hh === 2 ? 10 : 6, faceY = y * T + capH, faceH = hh * T - capH;
      rect(b, x * T, faceY, ww * T, faceH, "#cfc5b1");
      rect(b, x * T, faceY + faceH - 2, ww * T, 2, "#9e927c");
      rect(b, x * T, y * T, ww * T, 1, "#57506a");
    } else {
      rect(b, x * T + 6, y * T, 4, hh * T, "#4a445a");
    }
  }
  // 위쪽 바깥 벽의 창문 (화이트보드 자리는 비움)
  const boards = L.furniture.filter((f) => f.type === "board");
  for (let x = 3; x < L.w - 3; x += 6) {
    if (boards.some((f) => x + 2 >= f.x && x <= f.x + f.w)) continue;
    rect(b, x * T, 12, 2 * T, 16, "#4a445a"); rect(b, x * T + 2, 14, 2 * T - 4, 12, "#9fd3f0");
    rect(b, x * T + T - 1, 14, 2, 12, "#4a445a"); rect(b, x * T + 2, 14, 2 * T - 4, 3, "#c9ecfb");
  }
  // 시계 (팀장실 벽)
  rect(b, 2 * T + 4, 13, 9, 9, "#2b2b35"); rect(b, 2 * T + 5, 14, 7, 7, "#f4f1e8"); rect(b, 2 * T + 8, 15, 1, 3, "#222"); rect(b, 2 * T + 8, 17, 2, 1, "#222");
  for (const f of L.furniture) {
    const x0 = f.x * T, y0 = f.y * T;
    if (f.type === "rug") {
      rect(b, x0, y0, f.w * T, f.h * T, "#7d2e2e"); rect(b, x0 + 3, y0 + 3, f.w * T - 6, f.h * T - 6, "#a53d3d");
      for (let i = 6; i < f.w * T - 6; i += 8) rect(b, x0 + i, y0 + 6, 3, f.h * T - 12, "rgba(255,220,150,.18)");
    } else if (f.type === "board") {
      rect(b, x0, 12, f.w * T, 18, "#555"); rect(b, x0 + 2, 14, f.w * T - 4, 14, "#f7f7f7");
      rect(b, x0 + 6, 17, 20, 1, "#e33"); rect(b, x0 + 6, 20, 30, 1, "#36c"); rect(b, x0 + 6, 23, 14, 1, "#3a3");
      rect(b, x0 + 44, 17, 10, 8, "#fde68a");
    }
  }
  // 출입문 발판 (👤 사용자)
  const [dx, dy] = L.door;
  rect(b, dx * T, dy * T, 2 * T, T, "#5a4632"); rect(b, dx * T + 3, dy * T + 3, 2 * T - 6, T - 6, "#8b6b47");
}

// ── 길 찾기 (벽·가구는 못 지나감) ─────────────────────────────────
const BLOCKING = new Set(["desk", "table", "shelf", "plant", "cooler", "sofa"]);
function buildGrid() {
  grid = Array.from({ length: L.h }, () => new Uint8Array(L.w));
  const mark = (x, y, ww, hh) => { for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) if (grid[j]) grid[j][i] = 1; };
  for (const [x, y, ww, hh] of L.walls) mark(x, y, ww, hh);
  for (const f of L.furniture) if (BLOCKING.has(f.type)) mark(f.x, f.y, f.w, f.h);
}
function findPath(sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return [];
  const key = (x, y) => y * L.w + x, prev = new Map([[key(sx, sy), -1]]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) break;
    for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
      if (nx < 0 || ny < 0 || nx >= L.w || ny >= L.h || prev.has(key(nx, ny))) continue;
      if (grid[ny][nx] && !(nx === tx && ny === ty)) continue;
      prev.set(key(nx, ny), key(x, y)); q.push([nx, ny]);
    }
  }
  if (!prev.has(key(tx, ty))) return [[tx, ty]];
  const path = [];
  for (let k = key(tx, ty); k !== key(sx, sy); k = prev.get(k)) path.push([k % L.w, Math.floor(k / L.w)]);
  return path.reverse();
}
const feet = (tx, ty) => [tx * T + 8, ty * T + 15];

// ── 스냅샷 받기 ────────────────────────────────────────────────
function onSnapshot(s) {
  if (!s) return;
  snap = s;
  if (s.layout.key !== layoutKey) {
    L = s.layout; layoutKey = L.key;
    world.width = L.w * T; world.height = L.h * T;
    drawBackground(); buildGrid();
    for (const k of Object.keys(agents)) delete agents[k];
  }
  for (const d of s.agents) {
    let a = agents[d.id];
    if (!a) {
      const [x, y] = feet(...d.target);
      a = agents[d.id] = { x, y, path: [], dir: d.face, d, step: 0, goal: d.target.join(",") };
    }
    a.d = d;
    if (a.goal !== d.target.join(",")) {   // 갈 곳이 바뀜 → 걷기 시작
      a.goal = d.target.join(",");
      a.path = findPath(Math.floor(a.x / T), Math.floor(a.y / T), d.target[0], d.target[1]);
    }
  }
  let delay = 0;
  for (const ev of s.events) {
    if (seen.has(ev.id)) continue;
    seen.add(ev.id);
    if (firstRender) continue;                 // 처음 열었을 때 지난 쪽지는 다시 날리지 않는다
    mails.push({ ...ev, t0: performance.now() + delay });
    delay += 280;
  }
  firstRender = false;
  resize();
}

function posOf(id) {
  if (id === "__user__") { const [dx, dy] = L.door; return [(dx + 1) * T, dy * T + 6]; }
  const a = agents[id];
  return a ? [a.x, a.y - 30] : null;
}

// ── 크기 ────────────────────────────────────────────────────────
function resize() {
  if (!L) return;
  const cssW = Math.max(320, document.getElementById("wrap").clientWidth);
  scale = cssW / (L.w * T);
  const cssH = Math.round(L.h * T * scale);
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(cssW * dpr) || cv.height !== Math.round(cssH * dpr)) {
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr); cv.style.height = cssH + "px";
  }
  if (cssH !== lastH) { lastH = cssH; send("streamlit:setFrameHeight", { height: cssH + 2 }); }
}
window.addEventListener("resize", resize);

// ── 가구 ─────────────────────────────────────────────────────────
function ownerOfDesk(f) {   // 책상 바로 위 칸에 앉는 사람
  return snap.agents.find((a) => a.desk[0] === f.x + 1 && a.desk[1] === f.y - 1);
}
function drawDesk(f, now) {
  const x0 = f.x * T, y0 = f.y * T, ww = f.w * T;
  const owner = ownerOfDesk(f), a = owner && agents[owner.id];
  const atDesk = a && !a.path.length && owner.place === "desk";
  const top = f.lead ? "#8a5a33" : "#c8975b", front = f.lead ? "#5e3b20" : "#9a6b3c";
  rect(w, x0 + 1, y0 - 6, ww - 2, 9, top); rect(w, x0 + 1, y0 - 6, ww - 2, 1, f.lead ? "#a8744a" : "#dcae72");
  rect(w, x0 + 1, y0 + 3, ww - 2, 9, front); rect(w, x0 + 1, y0 + 11, ww - 2, 1, "#3d2a18");
  rect(w, x0 + 4, y0 + 6, ww - 8, 1, "rgba(0,0,0,.18)");
  // 모니터 (주인이 일하는 중이면 화면이 켜지고 깜빡인다)
  const on = atDesk && owner.tone === "working";
  rect(w, x0 + 1, y0 - 17, 13, 12, "#2b2b35");
  const flick = Math.floor(now / 180) % 3;
  rect(w, x0 + 2, y0 - 16, 11, 9, on ? ["#7fd1ff", "#8fe3c0", "#9bd8ff"][flick] : owner && owner.tone === "done" ? "#3d6b52" : "#3a4a5a");
  if (on) for (let i = 0; i < 3; i++) rect(w, x0 + 3, y0 - 14 + i * 3, 3 + ((flick + i) % 3) * 2, 1, "#1d4e6b");
  rect(w, x0 + 6, y0 - 5, 3, 2, "#2b2b35");
  rect(w, x0 + 33, y0 - 4, 7, 3, "#e8e8e8"); rect(w, x0 + 33, y0 - 4, 7, 1, "#fff");   // 서류
  rect(w, x0 + ww - 8, y0 - 6, 4, 4, "#e9e2d0"); rect(w, x0 + ww - 7, y0 - 5, 2, 2, "#6b3f1f");   // 머그
}
function drawChairBehind(seat) {
  const [x, y] = [seat[0] * T, seat[1] * T];
  rect(w, x - 4, y - 6, 24, 18, "#3d4452"); rect(w, x - 3, y - 5, 22, 3, "#59627a");
}
function drawTable(f) {
  const x0 = f.x * T, y0 = f.y * T, ww = f.w * T, hh = f.h * T;
  rect(w, x0, y0 - 5, ww, hh + 2, "#7b4f2c"); rect(w, x0 + 1, y0 - 4, ww - 2, hh, "#a26a3c");
  rect(w, x0 + 1, y0 - 4, ww - 2, 1, "#c08552"); rect(w, x0, y0 + hh - 3, ww, 3, "#5a3920");
  for (let i = 8; i < ww - 8; i += 22) { rect(w, x0 + i, y0 + 4, 12, 9, "#f4f1e8"); rect(w, x0 + i + 2, y0 + 6, 8, 1, "#999"); }
}
function drawShelf(f) {
  const x0 = f.x * T, y0 = f.y * T, ww = f.w * T;
  rect(w, x0, y0 - 10, ww, T + 10, "#5b3a22");
  const books = ["#c0392b", "#2e86c1", "#27ae60", "#f1c40f", "#8e44ad", "#e67e22", "#16a085"];
  for (const row of [y0 - 8, y0 + 3]) {
    rect(w, x0 + 1, row + 10, ww - 2, 2, "#3f2816");
    for (let i = 2, k = hash(String(f.x + row)); i < ww - 3; i += 3 + (k % 2)) {
      k = Math.imul(k, 48271) >>> 0;
      const hgt = 7 + (k % 3);
      rect(w, x0 + i, row + 10 - hgt, 2, hgt, books[k % books.length]);
    }
  }
}
function drawPlant(f) {
  const x0 = f.x * T, y0 = f.y * T;
  rect(w, x0 + 4, y0 + 9, 8, 6, "#9c5a32"); rect(w, x0 + 4, y0 + 9, 8, 1, "#b8703f");
  for (const [dx, dy, s] of [[3, 2, 5], [8, 1, 5], [5, -3, 6], [1, -1, 4], [10, 4, 4], [6, 4, 4]]) rect(w, x0 + dx, y0 + dy, s, s, dy < 0 ? "#3f9b4a" : "#2f7d3a");
}
function drawCooler(f) {
  const x0 = f.x * T, y0 = f.y * T;
  rect(w, x0 + 3, y0 - 2, 10, 17, "#e9edf2"); rect(w, x0 + 4, y0 - 12, 8, 10, "#8ecdf5"); rect(w, x0 + 5, y0 - 11, 2, 7, "#c8ecff");
  rect(w, x0 + 6, y0 + 4, 4, 2, "#d33");
}
function drawSofa(f) {
  const x0 = f.x * T, y0 = f.y * T, ww = f.w * T;
  rect(w, x0, y0 - 4, ww, 8, "#2f6f73"); rect(w, x0, y0 + 4, ww, 9, "#3f8a8f"); rect(w, x0, y0 - 4, 3, 17, "#245659"); rect(w, x0 + ww - 3, y0 - 4, 3, 17, "#245659");
}

// ── 캐릭터 (10×17 px, 모든 픽셀을 코드로) ─────────────────────────
const FRONT_HEAD = {
  0: ["..hhhhhh..", ".hhhhhhhh.", ".hhhhhhhh.", ".ssssssss.", ".ssessess.", ".ssssssss.", "..ssssss.."],
  1: ["..hhhhhh..", ".hhhhhhhh.", "hhhhhhhhhh", "hhssssssh.", "hssessessh", "h.ssssss.h", "..ssssss.."],
  2: ["...hhhh...", "..hhhhhh..", ".hhhhhhhh.", ".hssssssh.", ".ssessess.", ".ssssssss.", "..ssssss.."],
};
const BACK_HEAD = ["..hhhhhh..", ".hhhhhhhh.", ".hhhhhhhh.", ".hhhhhhhh.", ".hhhhhhhh.", ".shhhhhhs.", "..ssssss.."];
const BODY = ["..cwwwwc..", ".cccccccc.", "cccccccccc", "cdccccccdc", "cdccccccdc", "s.cccccc.s"];
const LEGS = [["..pppppp..", "..pp..pp..", "..pp..pp..", "..kk..kk.."],
              ["..pppppp..", "..pp...pp.", ".pp....pp.", ".kk....kk."],
              ["..pppppp..", ".pp...pp..", ".pp....pp.", ".kk....kk."]];
const P = 2;                                    // 캐릭터 한 픽셀 = 세계 2px (10×17 → 20×34)
function drawChar(a, now) {
  const d = a.d, h = hash(d.id);
  const pal = { h: HAIR[h % HAIR.length], s: SKIN[(h >> 3) % SKIN.length], e: "#1b1b1b", c: d.color, d: shade(d.color, -0.25),
                w: "#f4f4f4", p: PANTS[(h >> 6) % PANTS.length], k: "#222", t: "#7b1e1e", g: "#111" };
  const moving = a.path.length > 0;
  const working = !moving && d.tone === "working";
  const frame = moving ? 1 + (Math.floor(now / 160) % 2) : 0;
  const bob = moving ? (frame === 1 ? -1 : 0) : working ? (Math.floor(now / 300) % 2 ? -1 : 0) : 0;
  const dir = moving ? a.dir : d.face;
  const head = dir === "up" ? BACK_HEAD : FRONT_HEAD[h % 3];
  const seated = !moving && d.place === "desk";
  const rows = seated ? [...head, ...BODY] : [...head, ...BODY, ...LEGS[frame]];   // 앉으면 다리는 책상 뒤
  const left = Math.round(a.x) - 5 * P, top = Math.round(a.y) - 17 * P + bob + (seated ? 6 : 0);
  if (d.dim) w.globalAlpha = 0.38;
  if (!seated) { w.fillStyle = "rgba(0,0,0,.25)"; w.fillRect(left + 2, Math.round(a.y) - 2, 16, 3); }
  rows.forEach((row, r) => {
    for (let i = 0; i < 10; i++) {
      let ch = row[i];
      if (ch === ".") continue;
      if (working && r === 10 + (Math.floor(now / 140) % 2)) ch = ch === "d" ? "c" : ch;   // 타자 치는 팔
      if (dir === "left" && r === 4 && ch === "e") ch = "s";
      w.fillStyle = pal[ch] || pal.c;
      w.fillRect(left + i * P, top + r * P, P, P);
    }
  });
  if (dir !== "up") {
    if (d.lead) { w.fillStyle = "#f5c518"; w.fillRect(left + 4 * P, top + 8 * P, 2 * P, 4 * P); }          // 팀장: 금색 넥타이
    else if (/부장/.test(d.rank)) { w.fillStyle = pal.t; w.fillRect(left + 4 * P, top + 8 * P, 2 * P, 4 * P); }
    else if (/차장/.test(d.rank)) { w.fillStyle = pal.g; w.fillRect(left + 2 * P, top + 4 * P, 3 * P, P); w.fillRect(left + 5 * P, top + 4 * P, 3 * P, P); }  // 안경
  }
  w.globalAlpha = 1;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.max(0, Math.min(255, Math.round(v * (1 + f)))));
  return "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
}

// ── 쪽지 ─────────────────────────────────────────────────────────
function drawMail(x, y, kind) {
  x = Math.round(x) - 5; y = Math.round(y) - 3;
  rect(w, x, y, 11, 8, "#5a3d1f"); rect(w, x + 1, y + 1, 9, 6, "#fff7e0");
  for (let i = 0; i < 4; i++) { rect(w, x + 1 + i, y + 1 + i, 1, 1, "#b08a5a"); rect(w, x + 9 - i, y + 1 + i, 1, 1, "#b08a5a"); }
  rect(w, x + 4, y + 4, 3, 2, SEAL[kind] || "#d33");
}

// ── 한 프레임 ────────────────────────────────────────────────────
let lastT = performance.now();
function update(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  for (const a of Object.values(agents)) {
    let budget = 60 * dt;                       // 초당 60px ≈ 4칸
    while (budget > 0 && a.path.length) {
      const [tx, ty] = feet(...a.path[0]), dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy);
      if (Math.abs(dy) > Math.abs(dx)) a.dir = dy < 0 ? "up" : "down"; else if (dx) a.dir = dx < 0 ? "left" : "right";
      if (dist <= budget) { a.x = tx; a.y = ty; a.path.shift(); budget -= dist; }
      else { a.x += dx / dist * budget; a.y += dy / dist * budget; budget = 0; }
    }
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!L || !snap) return;
  update(now);
  w.imageSmoothingEnabled = false;
  w.drawImage(bg, 0, 0);
  // 앞뒤 순서(아래쪽이 앞)로 가구·사람을 함께 그린다
  const items = [];
  for (const f of L.furniture) {
    const y0 = f.y * T;
    if (f.type === "desk") { items.push([y0 + 4, () => drawDesk(f, now)]); const o = ownerOfDesk(f); if (o) items.push([y0 - T + 1, () => drawChairBehind(o.desk)]); }
    else if (f.type === "table") items.push([y0 + 2, () => drawTable(f)]);
    else if (f.type === "shelf") items.push([y0 + T, () => drawShelf(f)]);
    else if (f.type === "plant") items.push([y0 + T, () => drawPlant(f)]);
    else if (f.type === "cooler") items.push([y0 + T, () => drawCooler(f)]);
    else if (f.type === "sofa") items.push([y0 + T, () => drawSofa(f)]);
  }
  for (const a of Object.values(agents)) {
    if (a.d.id === snap.focus) items.push([a.y - 0.5, () => { w.fillStyle = "rgba(76,154,255,.55)"; w.fillRect(Math.round(a.x) - 12, Math.round(a.y) - 3, 24, 4); }]);
    items.push([a.y, () => drawChar(a, now)]);
  }
  items.sort((p, q) => p[0] - q[0]).forEach(([, fn]) => fn());
  // 쪽지 (맨 위)
  for (let i = mails.length - 1; i >= 0; i--) {
    const m = mails[i], t = (now - m.t0) / 1200;
    if (t < 0) continue;
    const p0 = posOf(m.from), p1 = posOf(m.to);
    if (!p0 || !p1 || t >= 1) { if (p1 && t >= 1) pops.push({ id: m.to, t0: now }); mails.splice(i, 1); continue; }
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const cx = (p0[0] + p1[0]) / 2, cy = Math.min(p0[1], p1[1]) - 34;
    const x = (1 - e) * (1 - e) * p0[0] + 2 * (1 - e) * e * cx + e * e * p1[0];
    const y = (1 - e) * (1 - e) * p0[1] + 2 * (1 - e) * e * cy + e * e * p1[1];
    for (let k = 1; k <= 3; k++) { w.fillStyle = `rgba(255,240,200,${0.35 - k * 0.1})`; w.fillRect(Math.round(x) - k * 3, Math.round(y) + k, 2, 2); }
    drawMail(x, y, m.kind);
  }

  // 화면 해상도로 확대 + 글자(이름표·말풍선)는 선명하게 따로
  const dpr = window.devicePixelRatio || 1;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(world, 0, 0, cv.width, cv.height);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawOverlay(now);
}
requestAnimationFrame(frame);

function roundRect(x, y, ww, hh, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + ww, y, x + ww, y + hh, r); g.arcTo(x + ww, y + hh, x, y + hh, r);
  g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + ww, y, r); g.closePath();
}
function clip(text, n) { const arr = [...text]; return arr.length > n ? arr.slice(0, n).join("") + "…" : text; }

function drawOverlay(now) {
  const S = scale, fs = Math.max(10, Math.min(13, 6.4 * S));
  g.textBaseline = "middle"; g.textAlign = "left";
  // 방 이름
  g.font = `bold ${fs - 1}px "Malgun Gothic", sans-serif`;
  for (const r of L.rooms) {
    const x = r.x * T * S + 6, y = r.y * T * S + (r.kind === "floor" ? 10 : 9);
    const tw = g.measureText(r.label).width;
    g.fillStyle = "rgba(20,18,28,.55)"; roundRect(x - 4, y - fs * 0.7, tw + 8, fs * 1.4, 4); g.fill();
    g.fillStyle = "#f3ead7"; g.fillText(r.label, x, y);
  }
  // 출입문 = 사용자
  {
    const [dx, dy] = L.door, x = (dx + 1) * T * S, y = dy * T * S - 2;
    g.font = `bold ${fs}px "Malgun Gothic", sans-serif`; g.textAlign = "center";
    const label = "👤 사용자", tw = g.measureText(label).width;
    g.fillStyle = "rgba(255,248,230,.92)"; roundRect(x - tw / 2 - 6, y - fs * 0.75, tw + 12, fs * 1.5, 5); g.fill();
    g.fillStyle = "#3a2a14"; g.fillText(label, x, y);
  }
  // 진행 중 표시
  if (snap.running || snap.stage) {
    g.font = `bold ${fs}px "Malgun Gothic", sans-serif`; g.textAlign = "right";
    const text = (snap.running ? "● LIVE · " : "") + snap.stage, tw = g.measureText(text).width, x = cv.width / (window.devicePixelRatio || 1) - 10;
    g.fillStyle = snap.running ? "rgba(200,40,40,.9)" : "rgba(20,18,28,.7)"; roundRect(x - tw - 10, 6, tw + 14, fs * 1.6, 5); g.fill();
    g.fillStyle = "#fff"; g.fillText(text, x - 3, 6 + fs * 0.8);
  }
  // 이름표 + 말풍선 (겹치면 위로 비켜 쌓는다)
  const placed = [];
  const list = Object.values(agents).sort((a, b) => b.y - a.y);
  g.textAlign = "center";
  for (const a of list) {
    const d = a.d, x = a.x * S, alpha = d.dim ? 0.45 : 1;
    g.globalAlpha = alpha;
    g.font = `bold ${fs - 1}px "Malgun Gothic", sans-serif`;
    const name = clip(d.name, 9), nw = g.measureText(name).width, ny = (a.y + 13) * S;
    g.fillStyle = d.id === snap.focus ? "#2563eb" : "rgba(25,22,32,.86)"; roundRect(x - nw / 2 - 5, ny - fs * 0.65, nw + 10, fs * 1.3, 3); g.fill();
    g.fillStyle = "#fff"; g.fillText(name, x, ny);
    g.globalAlpha = 1;
  }
  for (const a of list) {
    const d = a.d;
    let text = d.bubble;
    if (!text) continue;
    if (d.tone === "working") text = clip(text, 13) + ".".repeat(1 + Math.floor(now / 400) % 3);
    else text = clip(text, 13);
    const [bgc, bd, fg] = BUBBLE[d.tone] || BUBBLE.idle;
    g.font = `${d.tone === "working" ? "bold " : ""}${fs - 1}px "Malgun Gothic", sans-serif`;
    const tw = g.measureText(text + (d.tone === "working" ? ".." : "")).width, bw = tw + 12, bh = fs * 1.45;
    let bx = a.x * S - bw / 2, by = (a.y - 36) * S - bh;
    for (let k = 0; k < 6; k++) {
      const hit = placed.find((p) => bx < p[0] + p[2] && bx + bw > p[0] && by < p[1] + p[3] && by + bh > p[1]);
      if (!hit) break;
      by = hit[1] - bh - 2;
    }
    placed.push([bx, by, bw, bh]);
    g.globalAlpha = d.dim ? 0.5 : 1;
    g.fillStyle = bgc; g.strokeStyle = bd; g.lineWidth = d.tone === "working" || d.tone === "blocked" ? 2 : 1;
    roundRect(bx, by, bw, bh, 5); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(a.x * S - 4, by + bh); g.lineTo(a.x * S, Math.min(by + bh + 5, (a.y - 33) * S)); g.lineTo(a.x * S + 4, by + bh); g.closePath();
    g.fill(); g.stroke(); g.fillStyle = bgc; g.fillRect(a.x * S - 3, by + bh - 1.5, 6, 2);
    g.fillStyle = fg; g.textAlign = "left"; g.fillText(text, bx + 6, by + bh / 2 + 0.5); g.textAlign = "center";
    g.globalAlpha = 1;
  }
  // 쪽지 도착 — ✉️ 가 떠올랐다 사라진다
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i], t = (now - p.t0) / 900;
    if (t >= 1) { pops.splice(i, 1); continue; }
    const pos = posOf(p.id); if (!pos) continue;
    g.globalAlpha = 1 - t; g.font = `${fs + 3}px "Segoe UI Emoji", sans-serif`;
    g.fillText("✉️", pos[0] * S + 14, (pos[1] - 6) * S - t * 18);
    g.globalAlpha = 1;
  }
}

// ── 마우스: 올리면 설명, 누르면 그 에이전트 선택 ─────────────────────
function agentAt(ev) {
  const r = cv.getBoundingClientRect(), mx = (ev.clientX - r.left) / scale, my = (ev.clientY - r.top) / scale;
  const list = Object.values(agents).sort((a, b) => b.y - a.y);
  return list.find((a) => mx >= a.x - 12 && mx <= a.x + 12 && my >= a.y - 34 && my <= a.y + 17) || null;
}
cv.addEventListener("mousemove", (ev) => {
  const a = agentAt(ev);
  cv.style.cursor = a ? "pointer" : "default";
  if (!a) { tip.style.display = "none"; hoverId = null; return; }
  const d = a.d;
  if (hoverId !== d.id) {
    hoverId = d.id;
    tip.innerHTML = "";
    const b = document.createElement("b"); b.textContent = `${d.name} · ${d.rank}`; tip.appendChild(b);
    tip.appendChild(document.createTextNode("\n" + [d.about, d.bubble && "지금: " + d.bubble, d.note && "⛔ " + d.note, "누르면 아래에서 자세히 봅니다"].filter(Boolean).join("\n")));
  }
  tip.style.display = "block";
  const r = cv.getBoundingClientRect();
  let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 12;
  if (x + tip.offsetWidth > r.width) x = ev.clientX - r.left - tip.offsetWidth - 10;
  if (y + tip.offsetHeight > r.height) y = Math.max(0, r.height - tip.offsetHeight - 4);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
cv.addEventListener("mouseleave", () => { tip.style.display = "none"; hoverId = null; });
cv.addEventListener("click", (ev) => {
  const a = agentAt(ev);
  if (a) send("streamlit:setComponentValue", { value: { id: a.d.id, t: Date.now() }, dataType: "json" });
});
</script>
