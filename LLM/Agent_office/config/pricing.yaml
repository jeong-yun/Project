# 모델 가격표 — 메인 화면(🏠)의 '추정 비용' 계산용 (USD, 100만 토큰당 / per_call 은 1회당)
#
# - 추정 비용 = (입력 − 캐시 입력) × input + 캐시 입력 × cached_input + 출력 × output (÷ 100만)
#   무료 등급·배치 할인·세금·환율은 반영하지 않는다 → 실제 청구액은 각 사 콘솔
#   (OpenAI Usage · Google AI Studio/Cloud Billing · Anthropic Console · Upstage Console)에서 확인한다.
# - 화면의 '⚙️ 가격표'에서 고치면 이 파일 대신 data/runs.db 의 덮어쓰기 값이 쓰인다.
# - changes: 날짜부터 바뀌는 가격 (예: 도입 할인 종료) — 호출한 날짜의 가격으로 계산해 기록한다.
# - source: official = 각 사 공식 가격 페이지, third_party = 가격 비교 사이트 (공식 확인 필요). 확인일 2026-10-22
# - 모델 이름은 provider 사이에 겹치지 않으므로 모델 이름만으로 찾는다.

free_providers: [freellm]   # FreeLLMAPI 무료 모델 — 비용 0

models:
  # OpenAI
  gpt-5.5:      {input: 5.00, output: 30.00, cached_input: 0.50,  source: third_party}
  gpt-5.4:      {input: 2.50, output: 15.00, cached_input: 0.25,  source: third_party}
  gpt-5.4-mini: {input: 0.75, output: 4.50,  cached_input: 0.075, source: third_party}
  gpt-5.4-nano: {input: 0.20, output: 1.25,  cached_input: 0.02,  source: third_party}
  # Google Gemini (출력 가격에 thinking 토큰 포함)
  gemini-3.8-flash:
    {input: 0.75, output: 3.75, source: official, changes: [{from: "2027-01-01", input: 1.50, output: 7.50}]}  # 도입 가격 2026-12-31 까지
  gemini-3.6-flash:
    {input: 0.75, output: 3.75, source: official, changes: [{from: "2027-01-01", input: 1.50, output: 7.50}]}
  gemini-3.5-flash:      {input: 1.50, output: 9.00, source: third_party}   # 공식 가격 페이지에서 빠짐
  gemini-3.5-flash-lite: {input: 0.30, output: 2.50, source: official}
  gemini-3.1-flash-lite: {input: 0.25, output: 1.50, source: official}
  # Anthropic Claude
  claude-opus-5-5:   {input: 4.00, output: 20.00, cached_input: 0.20, source: official}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cached_input: 0.20, source: official}
  claude-haiku-5-5:  {input: 0.10, output: 0.50, source: official}
  # Upstage Solar
  solar-pro2: {input: 0.25, output: 0.25, source: third_party}
  solar-mini: {input: 0.15, output: 0.15, source: third_party}

per_call:   # 토큰이 아닌 호출(곡) 단위 과금
  lyria-3-clip-preview: 0.04   # 30초 클립 (official)
  lyria-3.5: 0.08              # 전체 곡 (official)
  lyria-3-pro-preview: 0.08    # (official)
