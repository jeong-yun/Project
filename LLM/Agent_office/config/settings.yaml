# 앱 전역 설정

default_team: general

review:
  # 관리자(상위 에이전트)는 지적만 하지 않고 보완된 답변을 직접 다시 작성한다.
  rewrite_answer: true

feedback:
  # 다음 실행 시 에이전트별 시스템 프롬프트에 주입할 최근 교훈 개수
  max_lessons_in_prompt: 5

storage:
  data_dir: data           # gitignore 대상 (runs.db, 업로드 이미지 등)
  db_file: runs.db
  # 사람이 채택한 결과를 파일(.md, 여행은 지도 .html 도)로 저장하는 폴더 — results/<팀>/
  results_dir: results
  # 사람이 채택/반려하지 않은(피드백 없는) 실행은 불필요한 기록이므로 삭제한다.
  # 앱 시작 시 이 시간보다 오래된 미결정 실행을 지운다 (진행 중인 화면을 보호하기 위해 약간의 여유를 둠)
  purge_undecided_after_hours: 1

avatar:
  allowed_ext: [png, jpg, jpeg, webp]
  size: 256                # 업로드 시 정사각형으로 리사이즈

llm_concurrency:
  # 형제 에이전트(서로 독립인 하위 업무)와 자료 조사가 동시에 진행되므로 provider 별 '동시 LLM 호출 수'를 제한한다.
  # 무료 티어의 분당 토큰·요청 한도(Groq 8천 TPM, Gemini 429)가 한꺼번에 터지지 않게 낮게 둔다. 0 이하면 제한 없음.
  default: 4               # 아래에 없는 provider
  freellm: 2               # FreeLLMAPI (Groq·Gemini 무료 티어 묶음)
  google: 3
  openai: 4
  claude_cli: 1            # Claude 구독(claude -p) — 호출마다 CLI 프로세스를 띄우고, 사람과 나눠 쓰는 구독 한도를 아끼려고 1개씩

claude_cli:
  # Claude 구독 호출 (config/models.yaml 의 provider: claude_cli, core/claude_cli.py)
  timeout_sec: 600         # 이 시간 안에 안 끝나면 중단하고 대안 모델로 (CLI 시작에만 5~7초)
  effort: ""               # low | medium | high | xhigh | max — 비우면 CLI 기본값. 낮추면 빠르고 구독 한도를 덜 쓴다

web_search:
  # 팀 team.yaml 의 tools 에 web_search 가 있고, 질문 화면의 '🌐 웹 검색' 이 켜져 있을 때 사용
  provider: duckduckgo     # 현재 지원: duckduckgo (API 키 불필요)
  max_queries: 3           # 질문 하나당 검색어 수 (보조 모델이 생성)
  max_results: 5           # 검색어당 결과 수
  max_total_results: 10    # 프롬프트에 넣을 최대 결과 수 (중복 제거 후, 뉴스 포함)
  region: kr-kr            # 한국 (영어 자료도 함께 나옴). wt-wt(전 세계)는 ddgs 내부 오류가 있어 비추천

concept:
  # 📚 개념 작성 페이지가 읽고 쓰는 IT 개념 카탈로그 (GitHub jeong-yun/CS 저장소를 로컬에 clone 한 경로)
  # 상대 경로는 이 프로젝트 폴더(Agent_office) 기준. 다른 PC 에서는 clone 한 위치로 바꾼다.
  catalog_dir: ../../../CS/Term/Every_day
  related_limit: 6          # 함께 비교할 관련 기존 항목 수 (무료 모델은 토큰 한도가 작아 6개 이하 권장)

music:
  # 🎵 음악 팀 (teams/music, features: music_track) — Google Gemini Lyria 로 MP3 생성 (GOOGLE_API_KEY 필요, 유료)
  auto_generate: false       # false: 화면의 '🎵 곡 만들기' 버튼을 눌렀을 때만 만든다 / true: 워크플로우가 끝나면 자동으로 (유료)
  clip_model: lyria-3-clip-preview   # 30초 고정 클립
  song_model: lyria-3.5              # 전체 곡 (길이는 프롬프트로 정한다)
  clip_seconds: 30           # 이 길이 이하 요청은 클립 모델로 만든다
  cost_usd:                  # 화면에 보여 줄 예상 비용 (1회 생성당, 대략값 — 실제 요금은 Google 가격표 기준)
    lyria-3-clip-preview: 0.04
    lyria-3.5: 0.08
  grade: true                # 만든 곡을 Gemini 가 듣고 브리프와 비교해 1~5점 채점
  grade_model: gemini-3.5-flash
  grade_threshold: 3         # 이 점수 미만이면 다시 생성
  max_regenerations: 0       # 채점이 낮을 때 자동으로 다시 만드는 최대 횟수 (0 이면 안 함 — 1 이상은 1회마다 추가 과금)
  duration_tolerance: 0.25   # 요청 길이와 ±25% 이상 다르면 화면에 '편집으로 맞추기' 안내
  edit_high_quality: false   # 템포·키 변경 고품질 모드 (3분 곡 약 30초 → 90초, CPU)

feeds:
  # 🏠 메인 화면의 📰 AI 브리핑 · 💡 개선 아이디어 카드 · 🔥 주목 저장소 (core/feeds.py)
  # 공식·무료 API 만 쓴다. 로그인이 필요한 사이트(인스타그램·링크드인·페이스북 그룹)는 긁지 않는다.
  # 수집 1회 = 소스별 검색 몇 번 + 보조 모델(models.yaml utility) 1회 → 🏠 사용량에 '뉴스·SNS 수집'으로 기록
  ttl_hours: 24              # 마지막 수집이 이보다 오래됐으면 메인 화면을 열 때 백그라운드로 다시 모은다 (주 2~3회면 48~72)
  auto_collect: true         # false: '🔄 지금 수집' 버튼을 눌렀을 때만
  source_timeout_sec: 40     # 소스마다 이 시간이 지나면 새 검색어를 멈추고 받은 것만 쓴다 (검색어 하나가 실패해도 나머지는 계속)
  request_timeout_sec: 10    # HTTP 요청 하나의 읽기 시간 제한
  max_items_for_llm: 40      # 모델에 넘기는 글 수 (소스를 돌아가며 골고루) — 많을수록 입력 토큰↑
  max_cards: 8               # 아이디어 카드 최대 수
  exclude_words: [nsfw, porn, hentai, casino, gambling, 성인, 도박, 카지노]   # 제목·설명·URL 에 있으면 뺀다
  news:                      # DuckDuckGo 뉴스 (키 불필요)
    keywords: [AI 에이전트, LLM, Claude, Gemini, OpenAI]
    per_keyword: 4
    region: kr-kr
    timelimit: w             # d(하루)·w(1주)·m(1개월)
  github:                    # GitHub 검색 API — .env GITHUB_TOKEN 이 있으면 한도↑ (없어도 동작, 10회/분)
    queries: [llm agent, ai agent framework, claude code, mcp server]
    created_days: 60         # 이 기간 안에 만들어지고
    pushed_days: 7           # 이 기간 안에 커밋(push)된 저장소만
    min_stars: 100
    per_query: 8
  hackernews:                # Hacker News Algolia API (키 불필요)
    queries: [LLM agent, Claude, AI coding, multi-agent]
    days: 7
    min_points: 30
    per_query: 8
  reddit:                    # REDDIT_CLIENT_ID·REDDIT_CLIENT_SECRET 이 .env 에 있을 때만
    subreddits: [LocalLLaMA, ClaudeAI, LangChain, ChatGPTCoding]
    period: week
    per_sub: 8
  naver:                     # NAVER_CLIENT_ID·NAVER_CLIENT_SECRET 이 .env 에 있을 때만
    queries: [AI 에이전트 활용, Claude 활용 후기, LLM 업무 자동화]
    types: [news, blog]
    per_query: 5
  threads:                   # THREADS_ACCESS_TOKEN 이 .env 에 있을 때만
    queries: [Claude Code, AI agent]
    per_query: 5

board:
  # 📺 전체 화면 보드 (주소 ?view=board, board_ui.py) · 🏠 메인 위쪽 '오늘의 한 줄' 띠
  rotate_sec: 8              # 뉴스 카드가 넘어가는 간격 (초) — 제목 2줄·요약 3줄을 한 번 읽을 만큼
  tip_rotate_sec: 20         # CLI 팁이 넘어가는 간격 (초)
  market_cache_min: 10       # 지수·환율을 Yahoo 에 다시 묻는 간격 (분) — 그 안에는 data/market/quotes.json 을 쓴다
  market_wait_sec: 4         # 새 시세를 화면이 기다리는 최대 시간 (초) — 늦으면 있던 값('—')으로 그리고 곧 다시 채운다
  market:                    # 맨 위 지수·환율 띠 (yfinance 티커, 순서 = 화면 순서). 비우면 띠를 그리지 않는다
    - { name: 코스피, ticker: ^KS11 }
    - { name: 코스닥, ticker: ^KQ11 }
    - { name: S&P 500, ticker: ^GSPC }
    - { name: 나스닥, ticker: ^IXIC }
    - { name: 다우, ticker: ^DJI }
    - { name: 원/달러, ticker: KRW=X }
