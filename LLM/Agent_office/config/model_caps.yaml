# 모델 능력표 — 이 모델이 그 일을 할 수 있는가 (core/model_caps.py)
#
# 화면의 모델 선택지와 실행 때 후보 목록은 '그 일에 필요한 능력'이 없는 모델을 숨기거나 건너뛴다.
#   예) 사진(그림)을 읽는 일 → vision: true 인 모델만. 텍스트 전용 모델(gpt-oss·Solar)은 사진을 받지 못해 실패한다.
#
# 능력
#   vision            : 사진(이미지) 입력을 받는다
#   structured_output : 정해진 형식(JSON 스키마)으로 답한다 — 팀 업무는 모두 이것을 쓴다
#   streaming         : 답을 조각으로 흘려보낸다 (초안 미리보기)
#   context           : 한 번에 넣을 수 있는 대략의 입력 토큰 수
#   true/false 를 안 쓰면 '모름'. 사진을 읽는 일은 '모름'도 숨긴다 (🧪 사진 시험으로 확인하면 보인다).
#
# 판단 순서 (아래로 갈수록 우선)
#   1) 이름 규칙 (core/model_caps.py NAME_RULES — gpt-oss·solar → 텍스트 전용 등)
#   2) 이 파일
#   3) 제공처 목록 API 가 알려 준 값 (예: Gemini models.list 의 inputTokenLimit, OpenRouter 형식 input_modalities)
#   4) 🧪 사진 시험·연결 시험 결과 (데이터 폴더 model_caps.json)
#   5) 사람이 화면에서 지정한 값 (데이터 폴더 model_caps.json)
#
# 쓰는 법: match 는 "provider:model" 에 대한 와일드카드(* ?). 여러 줄이 맞으면 아래 줄이 위 줄을 덮는다.
# source 에 근거를 적는다 (문서·실측 날짜).

models:
  # ── 텍스트 전용 ──
  - match: "*:gpt-oss-*"
    vision: false
    structured_output: true
    context: 131072
    source: "OpenAI gpt-oss 모델 카드(텍스트 전용, 128k 문맥) · 2026-10-20 FreeLLMAPI(Groq) 실측 json_schema 성공"
  - match: "upstage:solar-*"
    vision: false
    source: "Upstage Solar 대화 모델은 텍스트 입력만 받음 (사진은 별도 Document Parse API) · 2026-11-04 실측: solar-pro4 에 사진 → 400 'Image input is not allowed for this model'"
  - match: "upstage:solar-pro2"
    context: 65536
    structured_output: true
    source: "Upstage 문서 (65k 문맥) · 2026-10-19 실측 function_calling 구조화 출력 성공"
  - match: "upstage:solar-mini"
    context: 32768
    structured_output: true
    source: "Upstage 문서 (32k 문맥) · 2026-10-19 실측"

  # ── 사진 읽기 가능 ──
  - match: "google:gemini-*"
    vision: true
    structured_output: true
    streaming: true
    context: 1048576
    source: "Gemini API 모델 문서 — 입력: 텍스트·이미지·동영상·오디오, 입력 약 100만 토큰 · 2026-11-04 🧪 사진 시험: gemini-3.5-flash-lite 정답"
  - match: "openai:gpt-5*"
    vision: true
    structured_output: true
    streaming: true
    context: 400000
    source: "OpenAI 모델 문서 — GPT-5 계열 입력: 텍스트·이미지 (mini·nano 포함)"
  - match: "anthropic:claude-*"
    vision: true
    structured_output: true
    streaming: true
    context: 200000
    source: "Anthropic 모델 문서 — Claude 계열 입력: 텍스트·이미지"
  - match: "claude_cli:*"
    vision: true
    structured_output: true
    streaming: true
    context: 200000
    source: "Claude Code CLI `claude -p --input-format stream-json` 로 사진 블록 전달 — 2026-11-04 실측(도구 끈 상태, haiku: 글자·배경색 정답, --json-schema 함께 OK, 앱 경로 🧪 사진 시험 정답)"

  # ── 무료 프록시(FreeLLMAPI) ──
  # 같은 Gemini 라도 FreeLLMAPI 가 사진을 Google 까지 넘기는지는 프록시에 달렸다 → 이름만으로 '된다'고 하지 않는다.
  # 🧪 사진 시험으로 확인하면 그 결과가 우선한다 (model_caps.json). 실측 결과는 아래에 적는다.
  - match: "freellm:gemini-*"
    structured_output: true
    streaming: true
    source: "2026-10-20 FreeLLMAPI 실측 json_schema 성공 (사진 전달은 별도 확인)"
