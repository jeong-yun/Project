# 검증 설정 — LLM 이 LLM 을 채점할 때 환각·흔들림을 줄이기 위한 장치들
#
# 1) CoT 강제        : 검토·비평 출력 스키마에서 analysis(분석)를 점수보다 먼저 쓰게 한다 (core/schemas.py)
# 2) 퓨샷 루브릭     : 아래 review_rubric 의 점수 기준 + 실제 고득점/저득점 예시로 채점 '영점'을 잡는다
# 3) 구조화 단계 분할: 분배(Delegation) → 검토(ReviewResult) → 비평(CriticResult) 을 각각 JSON 키로 쪼갠다
# 4) 비평가(Critic)  : 검토자가 낸 '지적 → 수정' 과정의 논리 비약만 따로 채점한다 (LLM-as-a-Judge)
# 5) 자가 교정       : 비평가가 불합격 주면 "A 부분이 B 규칙에 어긋난다. 수정하라" 를 체인 중간에 넣어 다시 쓰게 한다
#
# 팀별로 루브릭을 바꾸려면 team.yaml 에 rubric: (아래 review_rubric 과 같은 형식) 을 넣는다.

review_rubric:
  scale: "1~10 점 (10 = 그대로 사용자에게 내보내도 되는 최상 품질)"
  levels:
    - "9~10: 사실이 정확하고 질문 의도를 완전히 충족, 근거·출처 표시, 빠진 관점 없음"
    - "6~8 : 대체로 맞지만 근거가 부족하거나 일부 관점·주의사항이 빠짐"
    - "3~5 : 중요한 내용이 빠지거나 일부 사실이 부정확함"
    - "1~2 : 질문과 무관하거나 핵심 사실이 틀림 (용어 혼동 포함)"
  examples:   # 퓨샷 — 채점 기준점 (실제 사례로 영점 맞추기)
    - question: "HBM 이 뭐야?"
      answer: "HBM(High Bandwidth Memory)은 DRAM 다이를 TSV 로 수직 적층해 GPU 바로 옆에 붙인 고대역폭 메모리로, AI 가속기에 주로 쓰인다 [1][2]."
      score: 9
      reason: "정의·구조·용도가 정확하고 출처 표시가 있다"
    - question: "HBF 가 뭐야?"
      answer: "HBF 는 HBM 의 다른 이름으로, 고대역폭 메모리를 말한다."
      score: 2
      reason: "HBF(High Bandwidth Flash, NAND 기반)를 HBM(DRAM 기반)과 혼동한 핵심 사실 오류이며 근거가 없다"

critic:
  enabled: true
  scope: final            # final: 최상위(supervisor) 통합 단계만 / all: 모든 검토·통합 단계 (호출 수 증가)
  min_score: 4            # 이 점수 미만이면 불합격 → 자가 교정
  fail_on: severe         # severe: 비평가가 severe(사실 오류·근거와 다른 숫자 등)로 표시한 위반이 있을 때만 불합격
                          # any   : 논리 비약·규칙 위반이 하나라도 있으면 불합격 (이전 동작 — 실측 불합격률 75%)
  max_self_corrections: 1 # 자가 교정 최대 횟수. 교정본이 더 나빠지면 비평 점수가 가장 높은 답변을 유지한다
  evidence_chars: 6000    # 비평가에게 넘기는 근거 자료(데이터 툴·웹 검색) 최대 글자 수 (0 = 넘기지 않음)
