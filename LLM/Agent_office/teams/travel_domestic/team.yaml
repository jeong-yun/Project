# 🚄 국내 여행팀 — 여행 날짜를 입력하면 KTX·버스·국내 숙소까지 담은 일자별 국내 여행 계획서를 만든다
#
# 예전 '여행 팀(travel)'을 국내·해외로 나눈 것 (해외는 teams/travel_abroad)
#   - 공용 스킬: teams/_shared/travel/ (두 팀이 함께 씀) + 이 팀만의 skills/
#   - 옛 기록: legacy — 예전 travel 업무 중 질문에 '국내 여행'이 있는 것, 교훈·팀원 모델 선택·저장 파일을 이어 받는다
#     (DB·파일은 고치지 않고 읽을 때만 붙인다 — core/storage.py set_team_links)
#
# 근거 자료
#   - travel_calendar 툴: N박 M일, 날짜별 요일·주말, 계절, D-day 를 '코드로' 계산 (LLM 의 날짜 계산 실수 방지)
#   - web_search      : 목적지의 그 시기 날씨·축제, KTX·고속버스, 숙소 지역, 맛집
# 하네스: itinerary_days — 일정이 1일차~마지막 날까지 모든 날을 다루는지 코드로 검사

id: travel_domestic
name: 🚄 국내 여행팀
description: 여행 날짜·인원·예산을 받아 KTX·고속버스·렌터카 동선과 국내 숙소까지 담은, 그대로 따라 할 수 있는 일자별 국내 여행 계획서를 만든다.

skills_from: [_shared/travel]
legacy: {team: travel, match: 국내 여행}

personas:
  staff: 당신은 여행사 신입 플래너입니다. 장소·식당·준비물 정보를 꼼꼼히 모으고 출처를 적습니다.
  assistant_manager: 당신은 전국을 다녀 본 국내 여행 플래너입니다. KTX·고속버스 시간표, 영업시간·예약 필요 여부를 현실적으로 확인합니다.
  deputy_gm: 당신은 일정 설계 전문가입니다. 동선이 겹치지 않고 무리 없는 하루 일정을 짭니다.
  gm: 당신은 국내 여행 상품 책임자입니다. 예산·안전·동행자(아이·어르신) 조건을 기준으로 계획을 점검합니다.
  team_lead: 당신은 20년 경력의 국내 여행 기획 총괄입니다. 여행자가 그대로 따라 할 수 있는 완성된 계획서로 정리합니다.

# 에이전트 id 는 예전 여행 팀과 같다 → 예전에 쌓인 교훈·팀원 모델 선택이 그대로 맞는다
org:
  id: lead
  rank: team_lead
  name: 팀장·국내여행기획
  specialty: 국내 여행 기획 총괄 — 목적지·컨셉 결정, 최종 계획서
  children:
    - id: gm_itinerary
      rank: gm
      name: 부장·일정
      specialty: 일자별 동선·일정 설계
      children:
        - id: am_spots
          rank: assistant_manager
          name: 대리·명소체험
          specialty: 명소·체험·운영시간·예약 정보 (지역 축제·휴무일)
        - id: staff_food
          rank: staff
          name: 사원·맛집
          specialty: 지역 맛집·카페·식사 동선
    - id: gm_logistics
      rank: gm
      name: 부장·교통숙박
      specialty: 교통·숙소·예산 관리
      children:
        - id: am_transport
          rank: assistant_manager
          name: 대리·교통숙소
          specialty: KTX·SRT·고속버스·렌터카·주차, 국내 숙소(호텔·펜션·한옥) 위치·가격대
        - id: staff_prep
          rank: staff
          name: 사원·준비물
          specialty: 그 시기 날씨·준비물·주의사항 (명절·연휴 교통 혼잡, 예매 시점)

review_criteria:
  - 여행 기간의 모든 날(날짜·요일)에 일정이 있는가 (여행 달력과 일치)
  - 이동 시간과 동선이 현실적인가 (KTX·버스 시간, 하루에 무리한 이동이 없는가)
  - 예산 안에 들어오는가 (항목별 합계)
  - 동행자 조건(아이·어르신 등)과 여행 스타일에 맞는가
  - 그 시기의 날씨·휴무·행사·연휴 혼잡을 반영했는가 (출처 포함)

output_format: markdown

tools: [travel_calendar, web_search]

# 추가 기능: route_map — 최종 계획서를 방문지 목록으로 바꿔 움직이는 지도(종류별 기호)로 보여 주고, 채택 시 지도도 함께 저장
features: [route_map]

search:
  hint: "목적지 + 여행 월을 넣어 '<목적지> <월> 날씨', '<목적지> 축제 <연도>', '<목적지> 가볼만한곳', '<목적지> 맛집', '<출발지> <목적지> KTX 고속버스' 검색어를 만든다. 목적지가 없으면 조건에 맞는 '<계절> 국내 여행지 추천' 으로 찾는다."
  max_total_results: 12

harness:
  validators: [itinerary_days, required_terms]
  max_retries: 2

tasks:
  - id: plan
    title: 🚄 국내 여행 계획서
    description: 날짜를 입력하면 일자별 일정·KTX/버스/렌터카 교통·국내 숙소·예산이 담긴 국내 여행 계획서를 만듭니다.
    fixed: {scope: 국내}
    fields:
      - {key: destination, label: 목적지 (비우면 추천), placeholder: "예: 부산, 강릉, 제주"}
      - {key: transport, label: 이동 수단, type: select, options: [상관없음, KTX·기차, 고속버스, 자가용·렌터카, 비행기(제주)], default: 상관없음}
      - {key: start_date, label: 출발일, type: date, required: true}
      - {key: end_date, label: 도착(귀가)일, type: date, required: true}
      - {key: departure, label: 출발지, default: 서울}
      - {key: people, label: 인원·동행, placeholder: "예: 성인 2, 초등학생 1"}
      - {key: budget, label: 예산, placeholder: "예: 총 60만원, 1인 30만원"}
      - {key: style, label: 여행 스타일, placeholder: "예: 맛집·휴양 위주, 걷기 적게"}
    question: |
      {start_date} 부터 {end_date} 까지 {nights}박 {days}일 {scope} 여행 계획을 세워줘.
      목적지: {destination}
      출발지: {departure}
      이동 수단: {transport}
      인원·동행: {people}
      예산: {budget}
      여행 스타일: {style}
    goal: "{nights}박 {days}일 국내 여행을 그대로 따라 할 수 있는 일자별 여행 계획서"
    success_criteria:
      - "1일차부터 {days}일차까지 모든 날의 일정을 'n일차 (날짜·요일)' 형식으로 오전·오후·저녁으로 나눠 쓴다"
      - "출발지에서 목적지까지 KTX·고속버스·자가용 등 수단별 소요 시간과 요금, 예매 시점을 쓴다"
      - "장소 사이 이동 수단과 대략의 소요 시간을 쓴다"
      - "숙소 추천 지역과 이유, 숙소 종류(호텔·펜션·한옥 등)와 가격대를 쓴다"
      - "교통·숙박·식비·입장료 등 항목별 예산 표와 합계를 쓴다"
      - "여행 시기의 날씨·행사·휴무·연휴 혼잡과 주의사항을 출처와 함께 쓴다"
      - "목적지가 정해지지 않았으면 조건에 맞는 후보 2곳을 비교해 1곳을 고른 이유를 먼저 쓴다"
    constraints:
      - "예산: {budget}"
      - "동행: {people}"
      - "스타일: {style}"
      - "이동 수단: {transport}"
    output_format: "한 줄 요약 → (목적지 선정 이유) → 일자별 일정 표 → 교통(오가는 길·현지 이동)·숙소 → 예산 표 → 날씨·준비물·주의사항"
    validators: [itinerary_days]
    harness_options:
      required_terms: ["예산", "숙소", "교통|이동"]

disclaimer: "운영시간·요금·교통편(KTX·버스 시간표)은 바뀔 수 있으니 출발 전 공식 사이트·코레일·버스 예매처에서 다시 확인하세요."
