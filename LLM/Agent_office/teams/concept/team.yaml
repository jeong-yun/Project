# 개념 편집 팀 — IT 개념 카탈로그(GitHub jeong-yun/CS 의 Term/Every_day) 항목을 팩트체크·분류·통합 판정해 최종본을 만든다.
#
# 메인 화면에서 다른 팀처럼 고른다 (조직도·에이전트 패널·이미지 편집·타임라인 동일). features 의 concept_catalog 가 있으면
# 화면이 concept_ui.py 의 조각을 함께 쓴다: 사이드바 카탈로그 위치, 작성/삭제 입력, 결과 탭, 채택 후 카탈로그 반영 → 커밋 → 푸시.
# 흐름: 개념명·초안 입력(기존에 있으면 수정 · 없으면 추가 — 자동 판정) → 관련 기존 항목을 함께 전달 → 이 팀이 검증·작성 →
#       사람이 채택 → 카탈로그 파일에 반영(통합된 항목은 old_term 으로) → 사람이 커밋·푸시
#       수정은 원본 기반(2026-11-10): 팀은 항목을 다시 쓰지 않고 변경 제안(원문 → 바꿀 글 + 근거)만 내고, 사람이 변경마다 근거를 보고 고른다
#       (core/concept.py 의 _update_brief · review_changes · assemble). 근거 글은 화면에만 — 카탈로그·커밋에는 들어가지 않는다.
# 작성 규칙 전문은 skills/it_concept_prompt.md (사용자의 'IT 개념 프롬프트') — 편집장·부장은 전문, 실무자는 org 의 skill_sections 절만 받는다.

id: concept
name: 개념 편집 팀
description: IT 개념(보안·AI·데이터 인프라) 초안을 원전 기준으로 팩트체크하고, 기존 카탈로그와 비교해 추가·수정·통합 여부를 판정한 뒤 카탈로그 형식의 최종본을 만든다.

# 자유 질문 범위 — 화면 안내 · '맡기기' 전 범위 확인 (core/scope.py). keywords 가 분명히 맞으면 모델 없이 통과
scope:
  summary: IT 개념(보안·AI·데이터 인프라) — 용어·약어의 뜻, 개념끼리 차이, 카탈로그 항목 팩트체크
  accepts:
    - 새 기술 용어·약어 설명 (예 HBF, RAG, 제로 트러스트)
    - 비슷한 개념끼리 차이 비교 (예 HBM 과 HBF)
    - 개념 카탈로그 항목의 사실 확인·보완
  rejects:
    - 주식·여행·음악·설계처럼 IT 개념이 아닌 질문
    - 실제 설정·코드 점검 (→ 보안부 팀) · 코드 작성 (→ 기본 팀)
  keywords: [개념, 용어, 약어, 뜻, 원리, 아키텍처, 프로토콜, 알고리즘, 암호화, AI, LLM, RAG, 머신러닝, 딥러닝, 트랜스포머, 벡터 DB, 데이터베이스, 클라우드, HBM, HBF, 반도체, 메모리, 네트워크, 제로 트러스트, 카탈로그]
# 자유 질문 예시 — '💡 질문 예시'에 이 팀 것만 보인다
free_examples:
  - title: 개념 조사 — 새 기술 용어
    question: HBF(High Bandwidth Flash)가 무엇인지 알려줘
    goal: 팀 회의에서 5분 안에 공유할 수 있는 HBF 설명 자료
    success_criteria:
      - 정식 명칭과 한 줄 정의를 제시한다
      - HBM 과의 차이를 표로 비교한다
      - 주요 개발 기업·시점 등 사실 정보마다 출처 번호를 단다
    constraints: [비전공자도 이해할 수 있게, A4 1장 분량]
    output_format: 한 줄 요약 → 비교 표 → 핵심 포인트 3개 → 출처
  - title: 개념 비교 — RAG 와 파인튜닝
    question: RAG 와 파인튜닝은 무엇이 다르고 언제 어느 쪽을 쓰는지 알려줘
    goal: 사내 챗봇 방식을 고르기 전에 읽을 개념 비교 자료
    success_criteria:
      - 두 개념의 정의를 한 줄씩 쓴다
      - 비용·최신성·정확도 기준으로 표로 비교한다
      - 어느 쪽을 고를지 판단 기준을 3개 쓴다
    constraints: [수식 없이, 원전(논문·공식 문서) 출처를 단다]
    output_format: 정의 → 비교 표 → 고르는 기준 → 출처
  - title: 보안 개념 — 제로 트러스트
    question: 제로 트러스트가 무엇이고 기존 경계 보안과 무엇이 다른지 알려줘
    goal: 보안 교육 자료에 넣을 제로 트러스트 개념 설명
    success_criteria:
      - NIST SP 800-207 기준 정의를 출처와 함께 쓴다
      - 경계 보안과의 차이를 표로 비교한다
      - 핵심 원칙 3개 이상을 예시와 함께 쓴다
    constraints: [비전공자용, A4 1장]
    output_format: 한 줄 정의 → 비교 표 → 핵심 원칙 → 출처
features: [concept_catalog]

personas:
  staff: 당신은 기술 문서 편집 보조입니다. 원전 논문·공식 문서를 찾아 식별자(저자·연도·arXiv ID·URL)를 정확히 정리합니다.
  assistant_manager: 당신은 꼼꼼한 팩트체커입니다. 초안의 주장마다 사실·과장·오류·누락·미확인을 판정하고 근거를 답니다.
  deputy_gm: 당신은 기술 계보 분석가입니다. 기존 카탈로그 항목과 원리·메커니즘을 비교해 병합·편입·별도 판정을 이중 해리로 검증합니다.
  gm: 당신은 수석 에디터입니다. 검증 결과를 스킬의 [출력 형식 견본] 모양(부제·①②③ 등장 배경·ⓐ 작동 원리·6.관계 유사/차이/경계 짝·7절 다섯 줄·번호 붙은 참고 문헌)의 개조식 최종본으로 다듬습니다.
  team_lead: 당신은 편집장입니다. 분류·태그·통합 판정의 일관성과 환각 여부를 최종 점검하고 적용 계획을 확정합니다.

org:
  id: lead
  rank: team_lead
  name: 편집장
  specialty: 최종 점검 — 분류·태그·통합 판정 일관성, 적용 계획(JSON) 확정
  children:
    - id: gm_editor
      rank: gm
      name: 부장·수석에디터
      # 업무 분배 공통 지시는 '필요한 사람만 골라도 된다'인데, 이 팀은 1단계(차장)·2단계(대리)가 둘 다 있어야 최종본이 나온다
      specialty: 검증 결과를 카탈로그 형식 최종본으로 통합 — 하위 두 명(2단계 대리, 1단계 차장)에게 항상 둘 다 맡긴다
      children:
        - id: am_fact
          rank: assistant_manager
          name: 대리·팩트체크
          specialty: 2단계 검증 로그 — 원전 식별, 주장별 사실/과장/오류/누락/미확인 판정, 체크리스트 12항목
          # 속도: 실무자는 맡은 절만 받고(스킬 전문 8.7천 자 → 약 절반) 최종본 전문을 쓰지 않는다 — 통합은 부장이 한다
          #   (2026-10-27 실측: 실무자 둘이 각자 최종본까지 쓰느라 출력 2.2천~1만 토큰, 계보분석 초안만 5분)
          skill_sections: ["[역할]", "[사전 제약 조건", "[2단계", "[5단계", "[퓨샷 앵커"]
          output_scope: >-
            2단계 검증 로그만 쓴다. <review_log> 안에 ① 원전 식별(저자·연도·arXiv ID·URL) ② 초안 주장별
            [✅사실 / ⚠️과장 / ❌오류 / ❌누락 / ❓미확인] 판정 표(근거 URL·원전명) ③ 체크리스트 12항목 결과를 쓴다.
            </review_log> 뒤에 '## 고칠 문장' — 틀리거나 과장된 초안 문장마다 '원문 → 교체문(개조식)' 한 줄씩
            (기존 항목 수정이면 원본 항목의 틀리거나 낡은 문장도 — 원문은 글자 그대로, 끝에 '근거: 문헌·식별자·URL — 무엇이 왜 틀렸는지'), 이어서
            '## 참고 문헌 후보' — 확인된 문헌만 카탈로그 한 줄 형식으로.
            <final> 최종본·GitHub 요약·적용 계획 JSON 은 쓰지 않는다 (부장이 통합해 쓴다).
        - id: dgm_lineage
          rank: deputy_gm
          name: 차장·계보분석
          specialty: 1단계 기존 용어 비교 — 비교 표, 이중 해리, 병합/편입/별도 판정, 기존 항목 수정 위치
          skill_sections: ["[역할]", "[사전 제약 조건", "[1단계", "[퓨샷 앵커"]
          output_scope: >-
            1단계 비교만 쓴다. <review_log> 안에 관련 기존 항목 비교 표(| 기존 용어 | 겹치는 점 | 다른 점(경계) | 조치 |),
            이중 해리 검사, 판정(병합 / 상위-하위 편입 / 별도+상호참조)과 근거, 기존 항목에서 고칠 위치(복붙용 교체문)를 쓴다.
            </review_log> 뒤에 '## 6.관계 초안' — 대상별 ' - 대상명: 유사: … / 차이: … / 경계: …' 한 줄씩
            (판정 근거로만 인용한 항목은 이름 뒤에 [판정 선례]).
            <final> 최종본·GitHub 요약·적용 계획 JSON 은 쓰지 않는다 (부장이 통합해 쓴다).

review_criteria:
  - <review_log> 안에 1단계 비교 표·이중 해리와 2단계 검증 로그 표가 최종본보다 먼저 있는가
  - 비교 표의 '조치'와 결론(병합/편입/별도)이 일치하고, 원리가 다른 개념을 편입하지 않았는가
  - 가짜·플레이스홀더 인용(존재하지 않는 arXiv ID·URL)이 없고, 확인되지 않은 사실은 제외하거나 '확인되지 않음'으로 표기했는가
  - 수치마다 측정 조건(벤치마크·워크로드)을 밝혔고 절대 표현(완벽·100%·무조건·완전 차단)이 없는가
  - 1번에 등장 배경(문제 → 원인 → 처방)이 있고 6.관계가 대상별 '유사/차이/경계' 짝으로 쓰였는가
  - "최종본이 개조식(명사형 종결)이고 참고문헌이 `[라벨] 저자. 제목 (식별자, URL): 역할 요약` 한 줄 형식인가"
  - "최종본 모양이 스킬의 [출력 형식 견본]과 같은가 (부제 줄·①②③ 등장 배경·ⓐⓑ 작동 원리·부적합 영역·7절 하위 항목 다섯 줄·'8. 참고 문헌'·§/「」 참조)"
  - 분류(Cloud/AI-App/AI-Model/Security)·태그가 개념의 핵심 목적에 맞는가 — AI 는 'LLM 앱이 코드만으로 적용할 수 있는가'(예 AI-App / 아니오 AI-Model)
  - 기존 항목 수정이면 최종본 전문 대신 변경 제안(changes)만 냈고, 변경마다 그것만 읽어도 판단할 수 있는 근거(문헌·식별자·URL 또는 어긴 형식 규칙)가 있으며, 근거 없는 바꿔 쓰기가 없는가

# 공통 규칙의 '- … 형식으로 작성한다' 줄에 들어간다 — 최종본은 마크다운이 아니라 카탈로그 모양이다
output_format: "markdown (단, <final> 최종본은 스킬의 [출력 형식 견본] 모양 — 굵게(**) 없이)"
tools: [web_search]

search:
  hint: "개념의 원전 논문(영문 정식 명칭 + arXiv 또는 학회명), 공식 문서·GitHub, 후속 반박·한계 논문을 찾는 검색어를 만든다. 영어 검색어를 우선한다."
  max_total_results: 10

# 편집장 검토는 1만 자 최종본을 통째로 다시 쓰지 않고 고칠 곳만 '찾을 문장 → 바꿀 문장'으로 (2026-10-27 실측: 다시 쓰기 84~446초)
review_mode: edit

harness:
  validators: [concept_entry]
  final_only: [concept_entry]
  max_retries: 2

verification:
  critic:
    # 비평가는 최종(편집장) 단계만 — 부장 통합 뒤에도 편집장 검토가 한 번 더 있다 (all 이던 때 비평 1회+대안 모델로 약 2분 더 걸림)
    scope: final
    max_self_corrections: 1
    rules:
      # 부장이 받는 것은 팀 결과(검증 로그 포함)와 웹 검색 발췌뿐이다 — 원전을 직접 볼 수 없으므로 글에서 확인되는 것으로 판정한다
      - "초안의 배치·계보 주장이 <review_log> 판정 표에 근거(URL·원전명) 없이 최종본·변경 제안에 사실로 들어가 있으면 '초안 구조 전제 수용' 위반이다"
      - "같이 쓰인다는 이유만으로 원리가 다른 개념을 편입하면 '이중 해리 미검사' 위반이다 (선례: GRPO ↔ RLVR 은 직교)"
      - "최종본·변경 제안의 수치·논문 식별자가 <review_log> 판정 표에도 [근거 자료]에도 없으면 '출처 미확인' 위반이다 (그 문헌이 실제로 있는지는 여기서 판정하지 않는다)"
      - "비교 표의 조치와 결론이 다르면 '판정 불일치' 위반이다"
      - "검증 로그가 '생략' 표시로 줄어 판정 표가 보이지 않으면 위 규칙으로 지적하지 않는다"

# 업무 양식 — 화면은 concept_ui.py 가 그린다 (작성: 개념명·초안·판정·관련 항목 / 삭제: 대상·미리보기)
# question·goal 은 화면에서 core/concept.py 가 만들므로 여기서는 쓰지 않는다
tasks:
  - id: write
    title: ✍️ 개념 작성 (기존에 있으면 수정 · 없으면 추가)
    description: 개념명과 초안을 넣으면 카탈로그에 같은 개념이 있는지 자동으로 판정합니다(있으면 수정, 없으면 추가). 편집 팀이 원전 기준으로 검증하고, 채택하면 카탈로그 파일에 반영한 뒤 커밋·푸시할 수 있습니다.
    question: "{name}"
    goal: "{name} 개념의 카탈로그 최종본"
  - id: delete
    title: 🗑 개념 삭제
    description: 고른 항목을 old_term.txt 로 옮기고 요약에서 뺍니다 (편집 팀 검토 없이 바로 처리).
    question: "{name} 삭제"
    goal: "{name} 항목 삭제"
