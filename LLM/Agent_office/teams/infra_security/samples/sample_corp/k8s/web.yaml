# 샘플상사(가상 회사) 쇼핑몰 웹 — 시험용 쿠버네티스 매니페스트.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: app
          image: registry.example.com/samplecorp/web:latest
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: APP_ENV
              value: production
            - name: DB_PASSWORD
              value: "PLACEHOLDER"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
        - name: log-agent
          image: registry.example.com/samplecorp/log-agent:1.4.2
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
