# 주식 팀 — 종목 추천 · 매수/보유/매도 판단 · 주가 전망 · 매매 전략 · 보유 종목 추가 매매 · 포트폴리오 구성
#
# 근거 자료
#   - stock_data 툴: Yahoo Finance 시세로 현재가·수익률·이동평균·변동성·밸류에이션·재무 지표·컨센서스(극단값 주의)·
#                    보유 평가손익·추가 매수 한도·평단 시뮬레이션을 '코드로' 계산
#   - web_search  : 최근 1개월 뉴스(news_timelimit: m) + 공시·증권사 리포트·실적 검색 (블로그·커뮤니티 제외)
# 숫자 검산
#   - stock_plan 검증기: 답변 끝 ```json 요약의 가중 점수·결정 밴드·평균 매수가·손익비·평단가를 코드로 다시 계산 →
#                        틀리면 정답 값을 알려 주며 다시 쓰게 하고, 화면에도 검산표를 따로 보여 준다 (core/stock_calc.py)
# ※ 모든 결과는 참고용 분석이며 투자 권유가 아니다 (disclaimer).

id: stock
name: 주식 팀
description: 최신 공시·리포트·뉴스·시세 데이터를 근거로 종목 추천, 매수/보유/매도 판단, 주가 전망, 매매 전략, 보유 종목 대응, 포트폴리오 구성안을 만든다.

personas:
  staff: 당신은 증권사 리서치센터의 신입 애널리스트입니다. 자료를 빠짐없이 모으고 출처와 날짜를 정확히 적습니다.
  assistant_manager: 당신은 꼼꼼한 주니어 애널리스트입니다. 숫자·날짜·출처가 자료와 일치하는지 검증합니다.
  deputy_gm: 당신은 시니어 애널리스트입니다. 실적·밸류에이션·산업 흐름으로 종목의 핵심 논리를 세웁니다.
  gm: 당신은 리스크 관리 책임자입니다. 하락 시나리오와 손실 한도를 먼저 따지고, 확정적 표현을 경계합니다.
  team_lead: 당신은 20년 경력의 투자전략 총괄이자 퀀트 트레이딩 전략가입니다. 근거·시나리오·리스크를 균형 있게 묶어 실행 가능한 결론을 냅니다.

# 조직도 — 팀장이 업무 유형에 맞는 전문가에게 나눠 준다
org:
  id: lead
  rank: team_lead
  name: 팀장·투자전략
  specialty: 투자전략 총괄 — 업무 분배, 최종 결론·행동 지침
  children:
    - id: gm_research
      rank: gm
      name: 부장·리서치
      specialty: 종목·산업 분석 총괄 (공시·리포트·뉴스·실적·시세)
      children:
        - id: dgm_news
          rank: deputy_gm
          name: 차장·뉴스리포트
          specialty: 최근 공시·증권사 리포트·목표주가·실적 발표 정리와 시장 심리
        - id: am_data
          rank: assistant_manager
          name: 대리·시세데이터
          specialty: 시장 데이터(주가 흐름·이동평균·변동성·밸류에이션·재무 지표) 해석
    - id: gm_risk
      rank: gm
      name: 부장·리스크
      specialty: 리스크 관리·매매 계획·포지션 전략·포트폴리오 비중
      children:
        - id: dgm_scenario
          rank: deputy_gm
          name: 차장·시나리오
          specialty: 상승·기본·하락 시나리오, 지지·저항 가격대, 분할 매수·목표가·손절가
        - id: staff_portfolio
          rank: staff
          name: 사원·포트폴리오
          specialty: 분산 투자 비중 계산·추가 매수 한도·리밸런싱 규칙 초안

review_criteria:
  - 숫자(주가·수익률·평가손익·재무 지표)가 시장 데이터와 일치하는가
  - 모든 수치에 출처와 기준일이 있는가 (확인되지 않은 값은 '확인 불가'로 남겼는가)
  - 사실(확정 실적·공시)과 전망(컨센서스·예측)을 구분했는가
  - 근거 뉴스·리포트가 최근(1개월 이내) 자료이고, 블로그·커뮤니티 글을 근거로 쓰지 않았는가
  - 확정적 표현 없이 시나리오·확률·조건으로 표현했는가
  - 하락 리스크와 손실 대응(손절 기준 등)을 다뤘는가
  - 점수·결론이 분석 내용과 일치하는가 (리스크를 크게 지적하고 높은 점수를 주거나 그 반대가 아닌가)
  - 투자자 조건(기간·성향·금액·비중)에 맞는가

output_format: markdown

tools: [stock_data, web_search]

# 웹 검색 설정 덮어쓰기 — '현 시점' 1차 자료 위주
search:
  hint: "종목명(정식 명칭)과 코드에 '실적 공시', '목표주가 리포트', '주가 전망', '최신 뉴스' 를 붙인 검색어를 만들고, 오늘의 연·월을 넣는다. 출처 우선순위는 DART 전자공시 → 한국거래소(KRX) → 네이버 금융·FnGuide → 증권사 리포트 → 언론 뉴스 순이다. 분야 추천이면 '<분야> 유망주 <연도>', '<분야> 관련주 리포트' 형태로 찾는다."
  news_timelimit: m        # 뉴스는 최근 1개월만
  max_total_results: 12
  # 근거로 쓰지 않는 사이트 (블로그·카페·커뮤니티·종목토론방)
  exclude_domains:
    - blog.naver.com
    - m.blog.naver.com
    - cafe.naver.com
    - tistory.com
    - brunch.co.kr
    - velog.io
    - dcinside.com
    - fmkorea.com
    - clien.net
    - ppomppu.co.kr
    - reddit.com
    - finance.naver.com/item/board
    - m.stock.naver.com/domestic/stock/board

harness:
  validators: [required_terms, stock_plan]
  final_only: [required_terms, stock_plan]   # 하위 실무자는 업무 일부만 쓰므로 최종 답변에만 검사
  max_retries: 2

# 비평가(Critic) — 주식 팀은 모든 검토·통합 단계에서 논리 비약을 검사하고, 최대 2회까지 자가 교정한다
verification:
  critic:
    scope: all
    max_self_corrections: 2
    rules:
      - "리스크를 크게 언급해 놓고 높은 점수(매수)를 주거나, 기회만 언급하고 낮은 점수(매도)를 주면 '점수-분석 불일치' 위반이다"
      - "출처·기준일 없이 등장한 수치나 단정적 주장은 '근거 없는 수치' 위반이다 (모르면 '확인 불가'로 써야 한다)"
      - "컨센서스·예측을 확정 사실처럼 쓰면 '사실·전망 구분' 위반이다"
      - "블로그·커뮤니티·종목토론방 글을 근거로 쓰면 '출처 우선순위' 위반이다"

# 업무 양식 — 화면에서 업무를 고르면 입력란이 나타나고, 입력값으로 질문·목표·완료 기준이 자동으로 만들어진다
# {key} 는 입력값으로 바뀌고, 값이 비어 있는 {key} 가 있는 줄은 빠진다.
# instructions 는 브리프 [배경]에 들어가 모든 에이전트가 따르는 업무 수행 지침이다.
tasks:
  - id: recommend
    title: 1) 분야별 종목 추천
    description: 관심 분야를 입력하면 종목마다 리스크 → 기회 → 1~5점 투자 매력도 순으로 평가해 추천합니다. (점수는 매수 추천이 아니라 매력도)
    fields:
      - {key: sector, label: 관심 분야, required: true, placeholder: "예: AI 반도체, 2차전지, 방산"}
      - {key: market, label: 시장, type: select, options: [국내, 미국, 국내+미국]}
      - {key: horizon, label: 투자 기간, type: select, options: ["단기(1~3개월)", "중기(6~12개월)", "장기(1년 이상)"]}
      - {key: risk, label: 투자 성향, type: select, options: [안정형, 중립형, 공격형]}
      - {key: count, label: 추천 종목 수, type: number, default: 3}
      - {key: candidates, label: 후보 종목 (선택), placeholder: "비워 두면 팀이 직접 선별. 예: 한미반도체, SK하이닉스"}
    question: |
      {market} 시장의 {sector} 분야에서 {horizon} 관점의 {risk} 투자자에게 맞는 종목 {count}개를 평가·추천해줘.
      후보 종목: {candidates}
    goal: "{sector} 분야 종목 {count}개의 투자 매력도(1~5점)와 종목별 리스크·기회 분석을 담은 투자 검토 자료"
    success_criteria:
      - "종목마다 정식 종목명과 코드(티커)를 쓴다"
      - "종목마다 '리스크 분석(3문장 이내) → 기회 분석(3문장 이내) → 점수' 순서로 쓴다 (점수를 먼저 쓰지 않는다)"
      - "종목마다 최근 1개월 내 공시·리포트·뉴스 근거를 날짜·출처 번호와 함께 2개 이상 제시한다"
      - "종목마다 '이 점수가 틀릴 수 있는 전제' 1가지를 쓴다"
      - "{risk} 성향과 {horizon} 기간에 맞는 이유를 설명한다"
      - "답변 맨 끝에 지침의 ```json 요약 블록을 붙인다"
    constraints:
      - "확정적 표현(무조건 오른다, 보장 등)을 쓰지 않는다"
      - "기준일(오늘) 이후 정보나 확인되지 않은 수치를 지어내지 않는다 — 모르면 '데이터 없음'"
      - "{horizon} 기준으로 판단한다"
    output_format: "한 줄 결론 → 종목 비교 표(종목·코드·점수·핵심 근거·리스크) → 종목별 상세(핵심 사실 → 리스크 → 기회 → 점수) → 유의사항 → ```json 요약"
    instructions: |
      목표는 '매수 추천'이 아니라 투자 매력도와 리스크를 근거와 함께 1~5점으로 평가하는 것이다.
      [채점 루브릭 — 투자 매력도]
      1점(비매력/고위험): 밸류에이션 과열 또는 실적 악화, 구조적 역풍이 뚜렷함
      2점: 리스크가 기회보다 우세 / 3점: 중립, 기회와 리스크가 상쇄됨
      4점: 실적·모멘텀·밸류에이션 중 2가지 이상 우호적
      5점(고매력): 실적 성장·산업 구조·진입장벽·밸류에이션이 모두 우호적
      [채점 예시 — 기준점]
      - 예시 1점: "최근 6개월 300% 급등, PER 80배, 매출 성장 둔화, 최대주주 지분 매도" → 밸류에이션이 실적 성장 속도를 크게 초과, 내부자 매도는 고점 신호 가능성, 산업 모멘텀 피크아웃 징후 → 1점
      - 예시 5점: "핵심 부품 과점 공급사, 글로벌 고객 초도 수주 확보, 2년 뒤 영업이익 3배 전망, PEG 0.8" → 병목 부품의 과점적 지위 + 실수주 기반 성장 + 성장 대비 저평가(PEG<1), 높은 진입장벽 → 5점
      [사고 순서] 종목마다 ① 핵심 재무·사업 사실(추측 금지) ② 리스크 지표(밸류에이션 과열·실적 둔화·수급 악화·규제·경쟁) 3문장 이내 ③ 기회 지표(실적 성장·진입장벽·산업 모멘텀) 3문장 이내 ④ 종합한 뒤에만 점수. 근거 없이 매긴 점수는 무효다.
      [JSON 요약 — 답변 맨 끝에 정확히 이 형식의 ```json 블록 1개]
      {"sector": "{sector}", "as_of_date": "YYYY-MM-DD", "candidates": [{"ticker": "종목명/코드", "extract_fundamentals": "핵심 사실", "analyze_risk": "리스크 분석", "analyze_opportunity": "기회 분석", "final_decision": {"score": 1~5 정수, "one_line_rationale": "점수의 핵심 근거 1문장", "key_assumption": "이 점수가 틀릴 수 있는 전제 1가지"}}]}
    validators: [stock_plan]
    harness_options:
      required_terms: ["리스크|위험", "출처|[1]"]
      stock_checks: [recommend]
      expected_count: "{count}"

  - id: judge
    title: 2) 종목 판단 (매수·보유·매도)
    description: 기업명을 입력하면 7개 항목(밸류에이션·실적·재무·성장·산업·수급·리스크)을 근거 먼저 채점하고, 가중 점수로 매수/보유/매도를 판단합니다. 점수 계산은 코드로 검산합니다.
    fields:
      - {key: stock, label: 기업명 또는 종목코드, required: true, placeholder: "예: 삼성전자, 005930"}
      - {key: horizon, label: 판단 관점, type: select, options: ["중기(6~12개월)", "단기(1~3개월)", "장기(1년 이상)"]}
    question: "{stock} 에 대해 최신 근거를 수집하고 7개 항목 루브릭으로 채점해 {horizon} 관점의 매수 / 보유 / 매도 결론을 내려줘."
    goal: "{stock} 의 7개 항목 점수(근거 포함)·가중 종합 점수·매수/보유/매도 결론·신뢰도를 담은 판단 보고서"
    success_criteria:
      - "맨 위에 [종목 식별] 기업명 / 종목코드 / 시장 / 업종 / 기준일을 쓴다 (동명이인·비상장·상장폐지 여부 확인)"
      - "7개 항목마다 근거 2~3문장(수치 + [출처, YYYY-MM-DD])을 먼저 쓰고 그 다음 줄에 점수 X/5 를 쓴다"
      - "종합 점수를 계산식과 함께 X.XX / 5.00 으로 쓴다"
      - "결론(매수/보유/매도/판단 보류)과 핵심 논거 3가지, 반대 논거(리스크) 2가지, 신뢰도(상/중/하)와 이유를 쓴다"
      - "답변 맨 끝에 지침의 ```json 요약 블록을 붙인다"
    constraints:
      - "모든 수치에 [출처, YYYY-MM-DD] 를 붙인다. 출처 없는 수치는 쓰지 않고 확인되지 않은 값은 '확인 불가'로 쓴다"
      - "사실(확정 실적·공시)과 전망(컨센서스·예측)을 구분해 표시한다"
      - "블로그·커뮤니티·종목토론방은 근거로 쓰지 않는다"
      - "확정적 표현을 쓰지 않는다"
    output_format: "[종목 식별] → [항목별 분석] ①~⑦ (근거 → 점수) → [종합 점수] 계산식 → [결론] 논거·리스크·신뢰도 → [면책] → ```json 요약"
    instructions: |
      너는 자문가가 아니라 근거 정리자다. 확신에 찬 단정 대신 검증된 근거와 불확실성을 함께 제시한다.
      [출처 우선순위] DART 전자공시 → 한국거래소(KRX) → 네이버 금융·FnGuide → 증권사 리포트 → 최근 뉴스. 주가·시가총액·밸류에이션은 조회 시점을 쓴다.
      [채점 루브릭 — 각 1~5점, 5=매수에 매우 우호적, 1=매도 신호 강함. 리스크 항목은 5=리스크 낮음]
      ① 밸류에이션 20% (PER·PBR·PEG·배당, 업종·과거 밴드 대비) ② 실적·수익성 20% (매출·영업이익 추세, 영업이익률, ROE)
      ③ 재무 건전성 15% (부채비율·유동비율·이자보상배율·영업현금흐름) ④ 성장성 15% (매출·이익 성장률, 산업 성장, 수주)
      ⑤ 산업·경쟁력 10% (시장 지위, 해자, 경쟁·규제) ⑥ 수급·모멘텀·심리 10% (주가 추세·거래량·기관/외국인 수급·컨센서스·뉴스 심리)
      ⑦ 리스크 10% (소송·지배구조·유상증자·공매도·대외변수)
      점수 앵커: 5=매우 우호 / 4=우호 / 3=중립·혼재 / 2=비우호 / 1=매우 비우호. 채점할 근거가 없으면 점수 대신 '데이터 부족'.
      [결정 밴드] 종합 = Σ(점수×가중치)÷100 → 3.75 이상 매수 / 2.50~3.74 보유 / 2.50 미만 매도 / 데이터 부족 항목 3개 이상이면 점수와 무관하게 '판단 보류'
      (데이터 부족 1~2개는 남은 항목 가중치로 다시 나눈다. 종합 점수는 코드가 검산한다)
      [기준점 예시 — 가상 사례]
      - A전자(반도체): 선행 PER 9배(업종 14배)·PBR 밴드 하단 4 / 3분기 연속 최대 실적·영업이익률 22%·ROE 18% 5 / 부채비율 38%·순현금 4 / 수주잔고 +40% 5 / 글로벌 과점 4 / 외국인 4주 순매수 4 / 특이 리스크 없음 4 → 4.35 매수, 신뢰도 상
      - B건설: 적자로 PER 불가·저PBR 함정 2 / 4분기 연속 영업적자 1 / 부채비율 480%·PF 우발채무 1 / 수주 급감 2 / 협상력 약함 2 / 기관 순매도 2 / 유상증자·감사의견 우려 1 → 1.55 매도
      [JSON 요약 — 답변 맨 끝에 정확히 이 형식의 ```json 블록 1개. 데이터 부족 항목은 null]
      {"scorecard": {"valuation": 4, "earnings": 5, "financial": 4, "growth": 5, "industry": 4, "momentum": 4, "risk": 4}, "composite": 4.35, "verdict": "매수", "confidence": "상"}
      verdict 는 "매수" / "보유" / "매도" / "판단 보류" 중 하나.
    validators: [stock_plan]
    harness_options:
      required_terms: ["종목 식별", "종합 점수", "신뢰도"]
      stock_checks: [scorecard]

  - id: forecast
    title: 3) 주가 전망
    description: 종목 이름 또는 코드를 입력하면 시세 데이터·최신 뉴스·리포트로 향후 주가를 시나리오별로 전망합니다.
    fields:
      - {key: stock, label: 종목 이름 또는 코드, required: true, placeholder: "예: 삼성전자, 005930, AAPL"}
      - {key: horizon, label: 전망 기간, type: select, options: [1주, 1개월, 3개월, 6개월]}
    question: "{stock} 종목의 향후 {horizon} 주가를 최근 뉴스·증권사 리포트·주가 흐름을 근거로 전망해줘."
    goal: "{stock} 종목의 {horizon} 주가 시나리오(상승·기본·하락)와 판단 근거를 담은 전망 보고서"
    success_criteria:
      - "기준일과 기준 주가를 시장 데이터에서 그대로 인용한다"
      - "상승·기본·하락 3개 시나리오마다 예상 가격 범위와 확률(합 100%)을 제시한다"
      - "근거가 된 최근 뉴스·리포트를 날짜·출처 번호와 함께 제시한다"
      - "주가에 영향을 줄 핵심 변수(실적 발표·금리·업황 등)와 확인할 시점을 쓴다"
    constraints:
      - "확정적 표현을 쓰지 않고 조건·확률로 표현한다"
      - "컨센서스 목표가는 전망치로 표시하고, 극단값 주의가 붙은 값은 근거로 쓰지 않는다"
    output_format: "한 줄 전망 → 기준 데이터 표 → 시나리오 표(가격 범위·확률·조건) → 근거 → 체크포인트"
    harness_options:
      required_terms: ["기준일", "시나리오", "상승", "하락", "확률"]

  - id: trade
    title: 4) 매매 전략 (분할 매수·목표가·손절가)
    description: 종목을 입력하면 최적 보유 기간을 고르고, 그 기간에 맞춘 3차 분할 매수·1·2차 목표가·손절가·손익비를 제시합니다. 평균 매수가·손익비·손절폭은 코드로 검산합니다.
    fields:
      - {key: stock, label: 종목 이름 또는 코드, required: true, placeholder: "예: 포스코인터내셔널, 047050"}
      - {key: horizon_pref, label: 원하는 보유 기간, type: select, options: [팀이 추천, 단기, 중기, 장기]}
      - {key: budget, label: 투자 예정 금액 (선택), placeholder: "예: 500만원"}
    question: |
      {stock} 의 1년 주가 흐름과 최신 재무 지표를 조사해 보유 기간 맞춤형 매매 전략(분할 매수·목표가·손절가·손익비)을 세워줘.
      원하는 보유 기간: {horizon_pref}
      투자 예정 금액: {budget}
    goal: "{stock} 의 최적 보유 기간과 그에 맞춘 3차 분할 매수 가격·비중, 1·2차 목표가, 손절가, 손익비를 담은 트레이딩 전략 보고서"
    success_criteria:
      - "펀더멘털·1년 주가 요약 표(52주 최고·최저, 이동평균, EPS·PER·PBR·배당수익률·배당성향)를 시장 데이터에서 인용한다"
      - "업종 평균 PER·PBR과 비교해 저평가 여부를 판단한다 (업종 평균을 못 찾으면 '확인 불가')"
      - "단기(1~3개월)·중기(3~6개월)·장기(1년 이상) 중 하나를 고르고 기술적·펀더멘털 근거를 쓴다"
      - "1·2·3차 분할 매수 가격과 비중(합 100%), 1·2차 목표가와 근거, 손절가와 근거를 표로 쓴다"
      - "평균 매수가·1차 목표가·손절가로 계산한 손익비를 쓴다"
      - "핵심 리스크 요인을 쓴다"
      - "답변 맨 끝에 지침의 ```json 요약 블록을 붙인다"
    constraints:
      - "보유 기간별 손절폭: 단기 3~5%, 중기 8~10%, 장기 15% 이상(또는 펀더멘털 훼손 시점) — 평균 매수가 대비"
      - "가격 근거는 이동평균·52주 고저·지지/저항 등 시장 데이터에 있는 값으로 설명한다"
      - "확정적 표현을 쓰지 않는다"
    output_format: "1. 펀더멘털·1년 주가 요약 표 → 2. 최적 보유 기간과 근거 → 3. 분할 매수 표(1·2·3차 가격·비중) → 4. 목표가·손절가 가이드(손익비 포함) → 5. 핵심 리스크 → ```json 요약"
    instructions: |
      [보유 기간별 가격 산출 원칙]
      - 단기: 타이트한 손익비, 20일·60일 이동평균 기반 단기 지지·저항 활용, 손절폭 3~5% 내외
      - 중기: 실적 사이클 반영, 120일 이동평균과 매물대 기반 스윙 전략, 손절폭 8~10% 내외
      - 장기: 펀더멘털 기반, 52주 최저가와 장기 밸류에이션 하단 활용, 손절폭 15% 이상 또는 펀더멘털 훼손 시점
      시장 데이터의 '보유 기간별 손절 참고가'를 참고한다. 손절가는 모든 분할 매수가보다 낮아야 한다.
      [계산 규칙 — 코드가 검산한다] 평균 매수가 = Σ(분할 매수가×비중)÷100, 손익비 = (1차 목표가 − 평균 매수가) ÷ (평균 매수가 − 손절가)
      [JSON 요약 — 답변 맨 끝에 정확히 이 형식의 ```json 블록 1개. 가격은 숫자만]
      {"trade_plan": {"horizon": "중기", "tranches": [{"price": 100000, "weight": 40}, {"price": 95000, "weight": 30}, {"price": 90000, "weight": 30}], "take_profit": [115000, 125000], "stop_loss": 87000, "risk_reward": 2.29}}
    validators: [stock_plan]
    harness_options:
      required_terms: ["보유 기간", "분할 매수", "손절", "손익비", "리스크|위험"]
      stock_checks: [trade_plan]

  - id: position
    title: 5) 보유 종목 전략 (추가 매매)
    description: 보유 종목·수량·평균 단가·비중·목적을 입력하면 포지션을 진단하고 물타기/불타기 타점·추가 매수 한도·분할 익절·기계적 손절을 세웁니다. 평단·한도는 코드로 검산합니다.
    fields:
      - {key: stock, label: 종목 이름 또는 코드, required: true, placeholder: "예: 삼성전자, PLTR"}
      - {key: quantity, label: 보유 수량(주), type: number, required: true}
      - {key: buy_price, label: 평균 단가, type: number, required: true, help: "원화 종목은 원, 미국 종목은 달러"}
      - {key: weight, label: 전체 투자 예산 중 이 종목 비중(%) — 모르면 0, type: number, default: 0}
      - {key: max_weight, label: 이 종목 최대 허용 비중(%), type: number, default: 30, help: "추가 매수 한도 계산에 씁니다"}
      - {key: purpose, label: 투자 목적, placeholder: "예: 장기 투자·배당 목적 / 단기 스윙"}
      - {key: horizon, label: 앞으로의 투자 기간, type: select, options: ["단기(1~3개월)", "중기(6~12개월)", "장기(1년 이상)"]}
      - {key: risk, label: 투자 성향, type: select, options: [안정형, 중립형, 공격형]}
    question: |
      {stock} 종목을 {quantity}주, 평균 단가 {buy_price}에 보유 중이야. 최신 펀더멘털과 현재 주가를 반영해 포지션을 진단하고 {horizon} 대응 전략(추가 매수·출구 전략)을 세워줘. 내 성향은 {risk}이야.
      전체 투자 예산 중 비중: {weight}% (0 이면 미정, 최대 허용 {max_weight}%)
      투자 목적: {purpose}
    goal: "{stock} 보유분({quantity}주)의 진단과 홀딩 판단, 추가 매수(물타기/불타기) 타점·한도, 분할 익절가, 기계적 손절가를 담은 액션 플랜"
    success_criteria:
      - "현재가·평균 단가 대비 손익률·평가손익과 펀더멘털(EPS·PER 등)·이동평균 대비 위치를 표로 제시한다 (시장 데이터 계산값 그대로)"
      - "홀딩 타당성을 판단하고 보유 / 추가매수 / 분할매도 / 전량매도 / 비중축소 중 권고안 1개를 쓴다"
      - "손실 중이면 단순 하락이 아닌 펀더멘털·차트 지지선 근거의 물타기 가격대를, 수익 중이면 추세 안착 후 돌파 매수(불타기) 지점을 쓰고, 추가 매수 후 평균 단가 시뮬레이션을 쓴다"
      - "현재 비중과 최대 허용 비중으로 최대 추가 매수 수량 또는 예산 한도를 쓴다 (비중을 모르면 보수적 한도)"
      - "50% 익절가와 100% 익절가, 평균 단가와 무관한 기계적 손절가(가치 훼손·핵심 지지선 이탈)와 이유를 쓴다"
      - "답변 맨 끝에 지침의 ```json 요약 블록을 붙인다"
    constraints:
      - "{risk} 성향, {horizon} 기간, 투자 목적에 맞춘다"
      - "직관적이고 냉정하게 쓴다 — 평균 단가에 대한 미련(본전 심리)으로 손절을 미루지 않는다"
      - "확정적 표현을 쓰지 않는다"
    output_format: "1. 현재 포지션 요약 표(현재가·손익률·펀더멘털) → 2. 포지션 진단·홀딩 의견 → 3. 추가 매수 타점·비중 관리(물타기/불타기, 평단 시뮬레이션, 한도) → 4. 분할 익절가·기계적 손절가 → ```json 요약"
    instructions: |
      시장 데이터의 '보유 평가', '비중·추가 매수 가능 금액', '추가 매수 후 평균 단가 시뮬레이션'은 코드 계산값이므로 그대로 인용한다.
      추가 매수 금액 합계는 추가 매수 가능 금액(최대 비중 한도)을 넘지 않게 한다. 추가 매수를 권하지 않으면 add_orders 는 빈 목록이다.
      [계산 규칙 — 코드가 검산한다] 새 평균 단가 = (평균 단가×보유 수량 + Σ추가 매수가×수량) ÷ (보유 수량 + Σ추가 수량)
      [JSON 요약 — 답변 맨 끝에 정확히 이 형식의 ```json 블록 1개. 가격은 숫자만]
      {"position_plan": {"action": "보유", "add_orders": [{"price": 60000, "quantity": 5}], "new_average": 68000, "take_profit_half": 80000, "take_profit_full": 90000, "stop_loss": 55000}}
      action 은 "보유" / "추가매수" / "분할매도" / "전량매도" / "비중축소" 중 하나.
    validators: [stock_plan]
    harness_options:
      required_terms: ["평가손익|손익률", "손절", "익절", "비중"]
      stock_checks: [position_plan]

  - id: portfolio
    title: 6) 포트폴리오 구성
    description: 투자 금액·기간·성향을 입력하면 종목(또는 ETF)별 비중과 리밸런싱 규칙을 담은 구성안을 만듭니다.
    fields:
      - {key: amount, label: 투자 금액, required: true, placeholder: "예: 1,000만원"}
      - {key: horizon, label: 투자 기간, type: select, options: ["단기(1~3개월)", "중기(6~12개월)", "장기(1년 이상)"]}
      - {key: risk, label: 투자 성향, type: select, options: [안정형, 중립형, 공격형]}
      - {key: market, label: 시장, type: select, options: [국내, 미국, 국내+미국]}
      - {key: preference, label: 선호 분야 (선택), placeholder: "예: 반도체, 배당주"}
      - {key: exclude, label: 제외할 분야·종목 (선택), placeholder: "예: 바이오"}
      - {key: holdings, label: 현재 보유 종목 (선택), type: textarea, placeholder: "예: 삼성전자 10주 평균 70,000원 / 애플 5주 평균 180달러"}
    question: |
