# 기본 바탕 팀 — 특정 분야에 치우치지 않는 범용 팀
id: general
name: 기본 팀
description: 범용 질의응답. 팀장(supervisor)이 질문을 받아 리서치·실행 전문가에게 나눠 맡기고 결과를 통합한다.

# 자유 질문 범위 — 화면 안내 · '맡기기' 전 범위 확인 (core/scope.py). keywords 가 분명히 맞으면 모델 없이 통과
scope:
  accept_all: true  # 범용 창구 — 다른 팀에 딱 맞지 않는 질문도 모두 받는다 (범위 확인 없음)
  summary: 무엇이든 — 전문 팀에 딱 맞지 않는 조사·정리·비교·코드 질문을 받는 범용 창구
  accepts:
    - 일반 조사·정리, 선택지 비교·추천
    - 짧은 코드·스크립트 작성
    - 글 초안(이메일·안내문)과 요약
  rejects:
    - (막지 않음) 주식·여행·음악·설계·보안·자소서처럼 전문 팀이 있는 질문은 그 팀이 더 잘합니다
# 자유 질문 예시 — '💡 질문 예시'에 이 팀 것만 보인다
free_examples:
  - title: 의사결정 — 선택지 비교
    question: 사내 문서 검색 챗봇에 쓸 벡터 DB 를 골라줘
    goal: 다음 주 아키텍처 회의에서 바로 결정할 수 있는 추천안
    success_criteria:
      - 후보 3개를 비용·운영 난이도·성능 기준으로 비교한다
      - 추천 1개와 그 이유, 선택하지 않은 이유를 쓴다
      - 도입 리스크와 대응 방안을 1개 이상 쓴다
    constraints: [사내 서버(온프레미스) 운영 가능해야 함, 문서 100만 건 규모]
    output_format: 결론(추천) → 비교 표 → 리스크 → 다음 행동
  - title: 코드 — 동작하는 결과물
    question: CSV 로그에서 IP 별 요청 수 상위 10개를 뽑는 파이썬 함수 만들어줘
    goal: 바로 붙여 넣어 실행할 수 있는 파이썬 함수와 사용 예
    success_criteria:
      - 표준 라이브러리만 사용한다
      - "```python 코드 블록이 문법 오류 없이 실행된다 (하네스 검증)"
      - 헤더가 없거나 빈 줄이 있어도 동작한다
    constraints: [함수 하나 + 사용 예 1개]
    output_format: 코드 블록 → 사용 예 → 주의사항
  - title: 글 초안 — 업무 이메일
    question: 거래처에 납품 일정이 1주 늦어진다고 알리는 정중한 이메일 써줘
    goal: 그대로 보낼 수 있는 이메일 초안
    success_criteria:
      - 늦어지는 이유와 새 일정을 첫 문단에 쓴다
      - 사과와 대안(부분 납품 등)을 1개 이상 제시한다
      - 제목 줄을 함께 쓴다
    constraints: [존댓말, 본문 10줄 이내]
    output_format: 제목 → 본문 → 서명

# 직급별 기본 페르소나. 조직도(org)의 persona 가 비어 있으면 이 값을 쓴다.
personas:
  staff: 당신은 성실하고 의욕적인 신입 사원입니다. 맡은 범위의 초안을 근거와 함께 씁니다.
  assistant_manager: 당신은 꼼꼼한 대리입니다. 사실 오류와 빠진 내용을 찾아 보완합니다.
  deputy_gm: 당신은 경험 많은 차장입니다. 논리의 허점과 리스크를 짚고 반대 관점을 반영합니다.
  gm: 당신은 실행을 책임지는 부장입니다. 확인된 사실은 빼지 않고, 실행 가능성과 우선순위 순으로 정리합니다.
  team_lead: 당신은 20년 경력의 팀장입니다. 질문 의도를 파악해 업무를 나누고, 최종 결론과 다음 행동을 명확하게 정리합니다.

# 조직도 — 사용자는 맨 위(supervisor)와 대화한다.
#   위 → 아래: 관리자가 질문을 보고 필요한 하위 에이전트를 골라 업무를 나눠 준다
#   아래 → 위: 실무자(하위가 없는 에이전트)가 초안을 쓰고, 관리자가 검토·통합해 올린다
# 칸(에이전트)을 추가하려면 children 에 항목을 더하면 된다. id 는 팀 안에서 겹치면 안 된다.
# rank 는 config/ranks.yaml 의 직급 id (모델·기본 이미지 결정), specialty 는 전문 분야.
org:
  id: lead
  rank: team_lead
  name: 팀장
  specialty: 총괄 — 질문 의도 파악, 업무 분배, 최종 결론
  children:
    - id: gm_research
      rank: gm
      name: 부장·리서치
      specialty: 사실관계·개념 정리
      # 직급 기본(personas.gm)은 '실행 책임'이라 전문 분야와 맞지 않는다 → 이 칸만 따로 (2026-11-11)
      persona: 당신은 사실관계 정리를 책임지는 부장입니다. 확인된 사실과 출처는 빼지 않고, 질문에 답하는 순서로 정리합니다.
      children:
        - id: dgm_research
          rank: deputy_gm
          name: 차장·분석
          specialty: 자료 분석·핵심 개념 설명
          children:
            - id: am_fact
              rank: assistant_manager
              name: 대리·팩트체크
              specialty: 출처·수치·용어 검증
            - id: staff_draft
              rank: staff
              name: 사원·초안
              specialty: 기본 개념 초안 작성
    - id: gm_action
      rank: gm
      name: 부장·실행
      specialty: 활용 방안·리스크·우선순위
      children:
        - id: am_action
          rank: assistant_manager
          name: 대리·실행안
          specialty: 실천 방법·주의사항 정리
          children:
            - id: staff_case
              rank: staff
              name: 사원·사례
              specialty: 사례·예시 조사

# 검토자가 공통으로 확인할 체크리스트
review_criteria:
  - 사실관계가 정확한가 (웹 검색 자료와 일치하는가)
  - 질문의 의도에 맞게 답했는가
  - 빠진 관점이나 리스크가 없는가
  - 실제로 실행 가능한가

output_format: markdown

# 이 팀에서 사용할 툴. web_search: 답변 전에 웹 검색으로 최신 자료·용어를 확인
tools: [web_search]

# 결정론적 검증 하네스 (core/harness). 예: [python_syntax, sql_sandbox, json_keys]
# 범용 팀은 코드가 없는 답변이 대부분이라 기본으로는 파이썬 코드 블록 문법 검사만 켠다 (코드가 없으면 통과).
harness:
  validators: [python_syntax]
  max_retries: 2

# 팀별로 직급 모델을 바꾸고 싶을 때 (형식은 config/models.yaml 의 ranks 와 동일)
model_overrides: {}

# 모든 최종 답변 하단에 붙일 문구 (예: 투자 권유 아님)
disclaimer: ""
