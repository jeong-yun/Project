review_criteria:
  - 목소리 출처(내 목소리 / 본인 동의 / 사용이 허락된 공개 데이터셋)와 사용 확인을 밝혔는가
  - 결과물을 남에게 보이거나 올릴 때 'AI 로 합성한 음성'이라고 표시하라는 안내가 있는가
  - 실존 가수·유명인 목소리를 대상으로 삼거나, 남을 속이는 데 쓸 수 있는 안내가 없는가
  - 명령·셀 번호·기본값이 팀 스킬 글(원본 파일)과 같은가 — 지어낸 옵션·숫자가 없는가
  - 근거 자료의 코드 값(화자 이름·epochs·batch_size·점검 숫자)을 바꿔 쓰지 않았는가
  - 걸리는 시간 같은 숫자는 원본 파일에 적힌 어림값만 쓰고, 없는 것은 '재 보지 않음'으로 썼는가

output_format: markdown

tools: [voice_svc]

# voice_kit — 최종 결과 아래 '🎁 맞춤 실행 파일'(zip) 내려받기 · 데이터 점검 표 (voice_ui.py)
features: [voice_kit]

harness:
  validators: [voice_guard]
  final_only: [voice_plan, voice_data]   # 실무자는 계획·해석의 일부만 쓰므로 전체 형식은 최종 답변에서만 검사
  max_retries: 2

tasks:
  - id: plan
    title: 📋 학습 계획 만들기
    description: 목소리 출처·가진 음원·작업 환경을 넣으면 단계별 실행 계획을 쓰고, 값을 넣은 Colab 노트북·전처리 스크립트·안내를 묶어 드립니다. 보컬 분리·학습·변환은 내 PC 와 Colab 에서 직접 돌립니다.
    fixed: {voice_task: plan, voice_kind: song}
    fields:
      - {key: source, label: 목소리 출처, type: select, required: true, options: [내 목소리, 본인 동의를 받은 사람의 목소리, 사용이 허락된 공개 데이터셋]}
      - {key: consent, label: "이 목소리를 학습·변환에 써도 된다는 것을 확인했습니다", type: checkbox, required: true,
         help: "다른 사람의 목소리라면 먼저 그 사람에게 학습·변환에 써도 된다는 동의를 받으세요. 확인이 없으면 계획과 노트북을 만들지 않습니다."}
      - {key: singer, label: 화자 이름 (영문·숫자·-_), required: true, placeholder: "예: myvoice", help: "dataset_raw/<화자 이름>/ 폴더 이름이 됩니다."}
      - {key: songs, label: 가진 음원 수 (곡), type: number}
      - {key: minutes, label: 대략의 노래 길이 합 (분), type: number, help: "보컬만 남기면 줄어듭니다. 30분~1시간 이상을 권합니다."}
      - {key: gpu, label: 이 PC 의 GPU, type: select, options: [없음, 있음 (NVIDIA)], default: 없음}
      - {key: where, label: 보컬 분리·자르기를 할 곳, type: select, options: [내 PC (A안), Colab (B안)], default: 내 PC (A안),
         help: "A안: 내 PC 에서 preprocess.py 로 만든 dataset_raw.zip 을 올림 · B안: 원본 곡 songs.zip 만 올리고 Colab GPU 로 처리"}
      - {key: oom, label: 학습 중 메모리 부족(OOM) 오류를 겪었습니다, type: checkbox}
      - {key: goal, label: 무엇을 변환하고 싶나요, type: textarea, placeholder: "예: 내 목소리로 좋아하는 발라드 커버 보컬 만들기"}
    question: |
      노래 음색 변환(SVC) 학습 계획을 세워줘.
      목소리 출처: {source} (사용해도 된다고 확인함: {consent})
      화자 이름: {singer}
      가진 음원: {songs}곡
      노래 길이 합: 약 {minutes}분
      이 PC 의 GPU: {gpu}
      보컬 분리·자르기: {where}
      학습 중 메모리 부족을 겪음: {oom}
      목표: {goal}
    goal: "화자 {singer} 의 노래 음색 변환 모델을 학습해 변환까지 따라 할 수 있는 단계별 실행 계획"
    success_criteria:
      - "첫 줄 근처에 목소리 출처({source})와 학습·변환에 써도 된다는 확인을 한 줄로 밝힌다"
      - "내 PC 에서 할 일 → Drive 에 올릴 것 → Colab 셀 순서 → 변환 → 반주 합치기를 번호 목록으로 쓴다"
      - "화자 이름 {singer}, epochs·batch_size 는 근거 자료의 '코드가 정한 학습 설정' 값을 그대로 쓴다"
      - "걸리는 시간은 근거 자료에 적힌 어림값만 출처와 함께 쓰고, 없는 숫자는 '재 보지 않음'으로 쓴다"
      - "결과물을 남에게 보이거나 올릴 때 'AI 로 합성한 음성'이라고 표시하라는 안내와 권리 체크리스트를 넣는다"
    output_format: "목소리 출처·확인 한 줄 → ## 실행 순서 (번호 목록) → ## 예상 소요 → ## 권리·표시 체크리스트 → 받은 파일 안내"
    instructions: |
      - 보컬 분리·학습·변환은 이 앱이 아니라 사용자의 PC 와 Colab 에서 돈다. 앱이 만든 맞춤 파일(zip)은 최종 결과 아래에서 내려받는다고 안내한다.
      - 근거 자료의 표(화자 이름·epochs·batch_size)는 코드가 정한 값이다. 바꾸거나 다른 값을 권하지 않는다 (자동 검증이 대조한다).
      - 명령·셀 번호·기본값은 팀 스킬 글에 적힌 것만 쓴다.
    validators: [voice_plan]

  - id: check
    title: 🔍 데이터 점검
    description: preprocess.py 로 만든 dataset_raw.zip 을 올리면 화자 폴더별 클립 수·총 길이·클립 길이·무음·클리핑을 코드로 세고, 팀이 해석과 다음 조치를 씁니다. 음원 내용은 모델로 보내지 않고 숫자 요약만 근거 자료가 됩니다.
    fixed: {voice_task: check, voice_kind: song}
    fields:
      - {key: dataset, label: "dataset_raw.zip (200MB 까지)", type: file, required: true, options: [zip],
         help: "dataset_raw 폴더를 통째로 zip 으로 묶어 올리세요. 파일은 이 PC 의 data/uploads/ 에만 저장되고, 모델에는 숫자 요약만 보냅니다."}
      - {key: goal, label: 궁금한 점 (선택), type: textarea, placeholder: "예: 이 정도면 학습을 시작해도 될까요?"}
    question: |
      올린 학습 데이터({dataset_name})를 점검하고 해석해줘.
      궁금한 점: {goal}
    goal: "코드가 계산한 점검 표를 바탕으로 학습을 시작해도 되는지와 다음 조치"
    success_criteria:
