         help: "켜면 맡기기 전에 검색어 초안(직무 이름·일반 기술 용어·연도만)을 보여 드립니다. 고치거나 지우고 '승인'을 눌러야 검색합니다."}
      - {key: github_url, label: GitHub 공개 저장소·README·PROJECTS.md 주소 (선택), placeholder: "https://github.com/계정/저장소/blob/main/PROJECTS.md"}
      - {key: github_as_source, label: GitHub 글을 내 문서(사실의 출처)로도 쓰기 — 내 저장소일 때만, type: checkbox}
      - {key: fmt_docx, label: Word(.docx), type: checkbox, default: true}
      - {key: fmt_hwpx, label: 한글(.hwpx), type: checkbox, default: true}
