      - {key: profile_text, label: 또는 요약 문서 붙여 넣기, type: textarea, placeholder: "경력·프로젝트·기술·숫자를 정리한 글을 그대로 붙여 넣으세요"}
      - {key: jd, label: "JD 붙여 넣기 (여러 개는 '---' 만 있는 줄로 나눔)", type: textarea,
         placeholder: "[가 회사 보안 분석가]\n[자격 요건]\n- …\n---\n[나 회사 데이터 엔지니어]\n[자격 요건]\n- …"}
      - {key: jd_file, label: JD 파일·화면 캡처 (기본 파일 하나 = JD 하나), type: file, multiple: true, options: [docx, pdf, hwp, hwpx, md, txt, png, jpg, jpeg, webp],
         help: "글 파일은 파일마다 JD 하나로 봅니다. 그림(png·jpg·webp)·스캔 PDF 는 비전 모델이 글자로 옮기고, 맡기기 전 확인 단계에서 캡처 여러 장을 'JD 묶음'으로 합치거나, 한 장에 든 여러 JD 를 '---' 줄로 나눌 수 있습니다 (그림은 고른 모델 회사로 전송)"}
    fixed: {career_kind: jd_recommend, fmt_md: "예"}
    question: |
      올린 요약 문서만 근거로 아래 JD 들이 나에게 얼마나 맞는지 요구사항마다 판정하고 추천 순위를 매겨줘.
      올린 문서: {docs_name}
      가상 인물 샘플 사용: {use_sample}
      JD 파일: {jd_file_name}
      희망 방향: {direction}
      (JD·요약 문서 원문은 근거 자료에 J1, J2 … 번호와 함께 있다)
    goal: "JD 마다 요구사항 대응(근거 있음·부분·공백) · 강점 · 공백 · 먼저 채울 것 · 한 줄 요약 + 코드가 계산한 적합도 순위와 가장 맞는 JD — 모든 사실은 올린 문서에서"
    success_criteria:
      - "근거 자료의 JD(J1…)를 하나도 빼지 않고, JD 마다 요구사항 ID(J1-R1…)를 모두 근거 있음 / 부분 / 공백으로 판정한다"
      - "근거 있음·부분은 요약 문서 원문을 글자 그대로 quote 에 인용한다 (코드가 대조, 틀리면 0점으로 센다)"
      - "ranking 은 근거 자료의 점수 계산 규칙으로 계산한 순서와 같고, best 는 1위 JD 다 (점수는 코드가 계산 — 본문에 점수 숫자를 쓰지 않는다)"
      - "JD 마다 한 줄 요약, 강점, 공백, 먼저 채울 것을 쓴다"
      - "답변 맨 끝에 [업무 수행 지침]의 ```json 블록(jd_fit · ranking · best · evidence · needs_check)을 정확히 1개 붙인다"
    constraints:
      - "경험·회사·프로젝트·숫자는 근거 자료의 '내 요약 문서 원문'에 있는 것만 쓴다. 없으면 [확인 필요]를 붙이고 needs_check 에 적는다"
      - "JD 에 있는 말(예: '경력 3년 이상')을 내 경험처럼 쓰지 않는다"
    output_format: "## 한눈에 보기 → ## J번호. JD 이름 (ranking 순서대로: 한 줄 요약 · 강점 · 공백 · 먼저 채울 것) → ## 다음 할 일 → ```json 1개 (순위·점수 표와 요구사항 대응표는 코드가 JSON 으로 만든다)"
    instructions: |
      [본문] 점수 숫자는 쓰지 않는다 (코드가 계산해 표로 붙인다). ranking 순서대로 JD 마다 '## J2. JD 이름' 절을 쓴다.
      [JSON 요약 — 답변 맨 끝에 이 형식의 ```json 블록 1개만]
      {"jd_fit": [{"jd": "J1", "title": "JD 이름", "summary": "한 줄 요약",
                   "coverage": [{"id": "J1-R1", "status": "근거 있음", "quote": "요약 문서 원문 그대로"}],
                   "strengths": ["강점"], "gaps": ["공백인 요구사항"], "fill_first": ["먼저 채울 것"]}],
       "ranking": ["J1"], "best": {"jd": "J1", "why": "가장 맞는 이유"},
       "evidence": [{"claim": "본문의 주장 한 줄", "quote": "요약 문서 원문 그대로"}],
       "needs_check": ["문서에 없어 [확인 필요]로 표시한 내용"]}
      status 는 "근거 있음" / "부분" / "공백" 중 하나. 공백이면 quote 는 빈 문자열. 위 값은 형식 예시일 뿐이다.
    validators: [jd_recommend]

  - id: portfolio_update
