         help: "지정하지 않으면 지금 포트폴리오의 직무 방향을 그대로 따르고, 부장의 직무 검토도 그 방향으로 봅니다"}
      - {key: use_sample, label: 🧪 가상 인물 샘플(예전 포트폴리오 + 최신 문서)로 해 보기, type: checkbox}
      - {key: role_custom, label: 기타 직무 (직접 입력), placeholder: "예: AI 거버넌스 담당, 보안 데이터 분석가"}
