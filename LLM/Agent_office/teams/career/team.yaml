      이유 · 출처)을 함께 줍니다. '🌐 외부 자료'를 켜면 직무 트렌드·용어를 검색하는데, 맡기기 전에 검색어를 보여 드리고 승인받습니다
      (이름·회사·프로젝트·숫자는 검색어에 넣지 않습니다). 외부 자료는 용어·트렌드에만 쓰고 내 경력·숫자는 내 문서에서만 씁니다.
