# 보안 거버넌스 팀 (뼈대) — 설정·정책 발췌를 받아 관리체계 통제 항목별로 충족 여부·증적·미비점을 정리한다
#
# 폴더 이름이 '_' 로 시작해 아직 앱 팀 목록에 나오지 않는다 (설계 문서 docs/AI_전용_업무_설계.md 의 1단계 시제품).
# 쓸 준비가 되면 폴더 이름을 security_governance 로 바꾼다.
#
# 원칙
#   - 증적에 없는 것은 '확인 불가' — 모델이 아는 '일반적인 회사의 상태' 로 채우지 않는다
#   - tools 에 web_search 를 넣지 않는다: 웹 검색어는 질문(내부 설정·정책 발췌)으로 만들어 외부로 나가므로
#   - 자율 실행(core/autonomy.py)으로 돌릴 때도 이 팀은 보고서만 쓴다 (level: observe)

id: security_governance
name: 보안 거버넌스 팀
description: 설정 파일·정책 문서 발췌를 ISMS-P · ISO/IEC 27001:2022 · NIST CSF 2.0 통제 항목에 대응시켜 충족 여부·증적·미비점·개선안을 표와 JSON 으로 정리한다.

personas:
  staff: 당신은 정보보호 관리체계 담당 신입입니다. 증적 문구를 그대로 인용하고, 없는 것은 없다고 씁니다.
  assistant_manager: 당신은 내부 감사 경험이 있는 담당자입니다. 증적이 통제 요구사항을 정말 만족하는지 하나씩 대조합니다.
  gm: 당신은 관리체계 인증 심사를 여러 번 받아 본 책임자입니다. 통제 항목 번호와 요구사항 해석이 맞는지 봅니다.
  team_lead: 당신은 정보보호 책임자입니다. 경영진이 바로 읽을 수 있게 위험도 순으로 정리합니다.

org:
  id: lead
  rank: team_lead
  name: 팀장·거버넌스
  specialty: 통제 점검 총괄 — 위험도 순 정리, 최종 보고서와 JSON
  children:
    - id: gm_mapping
      rank: gm
      name: 부장·통제 매핑
      specialty: 증적을 프레임워크 통제 항목에 대응 (항목 번호·요구사항)
      children:
        - id: am_evidence
          rank: assistant_manager
          name: 대리·증적 대조
          specialty: 통제 요구사항과 증적 문구를 하나씩 대조해 충족 / 부분 충족 / 미흡 / 확인 불가 판정
        - id: staff_gap
          rank: staff
          name: 사원·미비점
          specialty: 미흡·부분 충족 항목의 미비점과 바로 할 수 있는 개선안

review_criteria:
  - 통제 항목 번호·이름이 고른 프레임워크의 실제 항목인가 (지어낸 번호가 없는가)
  - 판정마다 증적 문구를 인용했는가 (증적이 없으면 '확인 불가' 인가)
  - 미흡 항목의 개선안이 구체적인가 (설정 값·문서 문장 수준)

output_format: markdown

tools: []

harness:
  validators: [json_keys, required_terms]
  final_only: [json_keys, required_terms]   # 하위 실무자는 일부만 쓰므로 최종 답변에만
  max_retries: 2

tasks:
  - id: control_check
    title: 통제 항목 점검
    description: 설정·정책 발췌를 붙여 넣으면 고른 프레임워크의 통제 항목별 충족 여부·증적·미비점을 정리합니다. (개인정보·비밀 값은 지우고 붙여 넣으세요)
    fields:
      - {key: framework, label: 프레임워크, type: select, options: [ISMS-P, "ISO/IEC 27001:2022", NIST CSF 2.0], required: true}
      - {key: scope, label: 점검 범위, placeholder: "예: 접근통제·로그 관리, 클라우드 계정"}
      - {key: evidence, label: 증적 (설정·정책 발췌), type: textarea, required: true}
    question: "{framework} 기준으로 아래 증적을 통제 항목별로 점검해줘.\n점검 범위: {scope}\n[증적]\n{evidence}"
    goal: "{framework} 통제 항목별 판정(충족/부분 충족/미흡/확인 불가)·인용 증적·미비점·개선안 표와 JSON 요약"
    success_criteria:
      - "통제 항목마다 항목 번호·이름 / 판정 / 증적 인용 / 미비점 / 개선안을 표로 쓴다"
      - "미흡 → 부분 충족 → 확인 불가 → 충족 순으로 정렬한다"
      - "답변 맨 끝에 지침의 ```json 블록을 정확히 1개 붙인다"
    constraints:
      - "증적에 없는 내용은 추정하지 않고 '확인 불가' 로 쓴다"
      - "통제 항목 번호를 모르면 번호를 비우고 이름만 쓴다 (번호를 지어내지 않는다)"
    instructions: |
      [판정 기준] 충족 = 요구사항을 증적이 직접 보여 줌 / 부분 충족 = 일부만 / 미흡 = 증적이 요구사항과 반대 / 확인 불가 = 판단할 증적 없음
      [JSON 요약 — 답변 맨 끝에 이 형식의 ```json 블록 1개만]
      {"summary": {"framework": "ISMS-P", "checked": 3, "fail": 1, "partial": 1, "unknown": 1, "pass": 0},
       "controls": [{"control_id": "2.5.6", "title": "접근권한 검토", "status": "미흡", "evidence": "인용한 증적 문구", "gap": "미비점", "fix": "개선안"}]}
      status 는 "충족" / "부분 충족" / "미흡" / "확인 불가" 중 하나.
    harness_options:
      required_keys: [summary, controls]
      required_terms: ["판정", "증적", "개선"]
