# 🌏 해외 여행팀 — 여행 날짜를 입력하면 입국·환전·시차·로밍·보험까지 챙긴 일자별 해외 여행 계획서를 만든다
#
# 예전 '여행 팀(travel)'을 국내·해외로 나눈 것 (국내는 teams/travel_domestic)
#   - 공용 스킬: teams/_shared/travel/ (두 팀이 함께 씀) + 이 팀만의 skills/ (입국·환전·시차 등)
#   - 옛 기록: legacy — 예전 travel 업무 중 질문에 '해외 여행'이 있는 것, 교훈·팀원 모델 선택·저장 파일을 이어 받는다
#
# 근거 자료
#   - travel_calendar 툴: N박 M일, 날짜별 요일·주말, 계절(남반구 주의), D-day 를 '코드로' 계산
#   - web_search      : 목적지의 그 시기 날씨·축제, 입국 조건, 환율, 항공·현지 교통, 숙소 지역, 맛집
# 하네스: itinerary_days — 일정이 1일차~마지막 날까지 모든 날을 다루는지 코드로 검사

id: travel_abroad
name: 🌏 해외 여행팀
description: 여행 날짜·인원·예산을 받아 항공·현지 교통·숙소에 비자/입국·환전·시차·로밍·여행자 보험까지 챙긴, 그대로 따라 할 수 있는 일자별 해외 여행 계획서를 만든다.

skills_from: [_shared/travel]
legacy: {team: travel, match: 해외 여행}

personas:
  staff: 당신은 여행사 신입 플래너입니다. 장소·식당·준비물 정보를 꼼꼼히 모으고 출처를 적습니다.
  assistant_manager: 당신은 해외 현장 경험이 많은 여행 플래너입니다. 항공·현지 교통·영업시간·예약 필요 여부를 현실적으로 확인합니다.
  deputy_gm: 당신은 일정 설계 전문가입니다. 시차와 이동 피로를 고려해 동선이 겹치지 않는 하루 일정을 짭니다.
  gm: 당신은 해외 여행 상품 책임자입니다. 예산·안전·입국 조건·동행자(아이·어르신) 조건을 기준으로 계획을 점검합니다.
  team_lead: 당신은 20년 경력의 해외 여행 기획 총괄입니다. 여행자가 그대로 따라 할 수 있는 완성된 계획서로 정리합니다.

# 에이전트 id 는 예전 여행 팀과 같다 → 예전에 쌓인 교훈·팀원 모델 선택이 그대로 맞는다
org:
  id: lead
  rank: team_lead
  name: 팀장·해외여행기획
  specialty: 해외 여행 기획 총괄 — 목적지·컨셉 결정, 최종 계획서
  children:
    - id: gm_itinerary
      rank: gm
      name: 부장·일정
      specialty: 일자별 동선·일정 설계 (시차·도착 시간 반영)
      children:
        - id: am_spots
          rank: assistant_manager
          name: 대리·명소체험
          specialty: 명소·체험·운영시간·예약 정보 (현지 공휴일)
        - id: staff_food
          rank: staff
          name: 사원·맛집
          specialty: 현지 맛집·카페·식사 동선, 팁 문화
    - id: gm_logistics
      rank: gm
      name: 부장·교통숙박
      specialty: 항공·현지 교통·숙소·예산(환율) 관리
      children:
        - id: am_transport
          rank: assistant_manager
          name: 대리·교통숙소
          specialty: 항공편·공항 이동·현지 교통 패스, 숙소 위치·가격대
        - id: staff_prep
          rank: staff
          name: 사원·출국준비
          specialty: 비자·전자여행허가·여권 유효기간, 환전·카드, 시차, 로밍·eSIM, 전압·플러그, 여행자 보험

review_criteria:
  - 여행 기간의 모든 날(날짜·요일)에 일정이 있는가 (여행 달력·시차와 일치)
  - 이동 시간과 동선이 현실적인가 (도착일·출국일 일정이 가벼운가)
  - 예산 안에 들어오는가 (원화 환산 합계, 기준 환율과 날짜)
  - 입국 조건(비자·전자여행허가·여권 유효기간)과 출국 준비물(환전·로밍·보험)을 빠짐없이 챙겼는가
  - 그 시기의 날씨·현지 공휴일·행사를 반영했는가 (출처 포함)

output_format: markdown

tools: [travel_calendar, web_search]

features: [route_map]

search:
  hint: "목적지 + 여행 월을 넣어 '<목적지> <월> 날씨', '<목적지> 입국 조건 한국인', '<통화> 환율', '<목적지> 축제 <연도>', '<목적지> 가볼만한곳', '<목적지> 맛집', '<출국 공항> <목적지> 항공' 검색어를 만든다. 목적지가 없으면 조건에 맞는 '<계절> 해외 여행지 추천' 으로 찾는다."
  max_total_results: 14

harness:
  validators: [itinerary_days, required_terms]
  max_retries: 2

tasks:
  - id: plan
    title: 🌏 해외 여행 계획서
    description: 날짜를 입력하면 일자별 일정·항공/현지 교통·숙소·예산에 비자/입국·환전·시차·로밍·보험 체크리스트까지 담은 해외 여행 계획서를 만듭니다.
    fixed: {scope: 해외}
    fields:
      - {key: destination, label: 목적지 (비우면 추천), placeholder: "예: 오사카, 다낭, 파리"}
      - {key: airport, label: 출국 공항, default: 인천}
      - {key: start_date, label: 출국일, type: date, required: true}
      - {key: end_date, label: 귀국일, type: date, required: true}
      - {key: people, label: 인원·동행, placeholder: "예: 성인 2, 초등학생 1"}
      - {key: budget, label: 예산 (원화), placeholder: "예: 총 300만원, 1인 150만원"}
      - {key: style, label: 여행 스타일, placeholder: "예: 맛집·휴양 위주, 걷기 적게"}
      - {key: passport, label: 여권·비자 상황, placeholder: "예: 여권 만료 2027-03, 비자 없음"}
    question: |
      {start_date} 부터 {end_date} 까지 {nights}박 {days}일 {scope} 여행 계획을 세워줘.
      목적지: {destination}
      출국 공항: {airport}
      인원·동행: {people}
      예산: {budget}
      여행 스타일: {style}
      여권·비자: {passport}
    goal: "{nights}박 {days}일 해외 여행을 그대로 따라 할 수 있는 일자별 여행 계획서와 출국 준비 체크리스트"
    success_criteria:
      - "1일차부터 {days}일차까지 모든 날의 일정을 'n일차 (날짜·요일)' 형식으로 오전·오후·저녁으로 나눠 쓴다 (현지 시각 기준, 시차 표시)"
      - "항공편 시간대·공항↔숙소 이동·현지 교통(패스 포함)과 대략의 소요 시간을 쓴다"
      - "숙소 추천 지역과 이유, 가격대를 쓴다"
      - "교통·숙박·식비·입장료 등 항목별 예산 표를 현지 통화와 원화(기준 환율·날짜 표시)로 쓰고 합계를 쓴다"
      - "입국 조건(비자·전자여행허가·여권 유효기간), 환전·카드, 로밍·eSIM, 전압·플러그, 여행자 보험을 체크리스트로 쓴다 (출처 포함)"
      - "여행 시기의 날씨·현지 공휴일·행사와 주의사항을 출처와 함께 쓴다"
      - "목적지가 정해지지 않았으면 조건에 맞는 후보 2곳을 비교해 1곳을 고른 이유를 먼저 쓴다"
    constraints:
      - "예산: {budget}"
      - "동행: {people}"
      - "스타일: {style}"
      - "여권·비자: {passport}"
    output_format: "한 줄 요약 → (목적지 선정 이유) → 출국 준비 체크리스트 → 일자별 일정 표 → 항공·현지 교통·숙소 → 예산 표(현지 통화·원화) → 날씨·주의사항"
    validators: [itinerary_days]
    harness_options:
      required_terms: ["예산", "숙소", "교통|이동", "입국|비자", "환전|환율"]

disclaimer: "입국 조건·환율·요금·항공편은 바뀔 수 있으니 출발 전 외교부 해외안전여행·대사관·항공사 공식 사이트에서 다시 확인하세요."
