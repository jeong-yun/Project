# gitleaks 설정 — 기본 규칙을 모두 쓰고, '진짜 오탐'만 좁게 예외로 둔다.
# 예외를 넓히지 않는다: 폴더 전체나 규칙 전체를 끄지 않고, 파일 + 값 모양을 함께 지정한다.
# 실제 키가 걸리면 예외에 넣지 말고 키를 폐기(revoke)한 뒤 SECURITY.md 의 절차를 따른다.

title = "jeong-yun/Project gitleaks config"

[extend]
useDefault = true

# Agent Office 사용량 기능 테스트가 쓰는 가짜 OpenAI 키 모양 문자열.
# 키 지문(앞 몇 글자만 보여 주기) 기능을 시험하려고 일부러 키처럼 생긴 값을 넣었다. 실제 키 아님.
#   예: sk-old-key-000000001111, sk-proj-ABCDEFGHIJKLMNOP1234, sk-test-0000000000001234
[[allowlists]]
description = "Agent Office 테스트용 가짜 OpenAI 키 (tests/test_usage.py)"
condition = "AND"
paths = ['''^LLM/Agent_office/tests/test_usage\.py$''']
regexes = [
  '''^sk-(?:old|new|now|test)-key-\d+$''',
  '''^sk-proj-ABCDEFGHIJKLMNOP\d{4}$''',
  '''^sk-test-0+1234$''',
]

# 교육부 취미 팀 화면 테스트의 Streamlit 칸 이름(key=) — '칸 종류 + 가상 과목 id(hitaly01)'라 무작위 문자열처럼 보여
# generic-api-key 로 잡혔다 (예: hb_vq_hitaly01 = 단어 퀴즈 칸). 실제 키 아님. 이 파일 + 이 모양만 예외.
[[allowlists]]
description = "Agent Office 교육부 테스트의 화면 칸 이름 (tests/test_edu_hobby.py)"
condition = "AND"
paths = ['''^LLM/Agent_office/tests/test_edu_hobby\.py$''']
regexes = [
  '''^[a-z]+(?:_[a-z]+)*_hitaly\d{2}$''',
]

# G2 마스킹 테스트(train_set_making_by_rule(talos, et)/tests/test_mask.py)의 가짜 민감값 — 마스킹이 JWT·client_secret 을
# 가리는지 시험하려고 일부러 넣은 예시 값 (가짜 도메인 corp-mail.test 와 같은 줄). 실제 토큰 아님. 이 파일 + 이 값들만 예외.
[[allowlists]]
description = "G2 마스킹 테스트의 가짜 JWT·client_secret (tests/test_mask.py)"
condition = "AND"
paths = ['''^LLM/train_set_making_by_rule\(talos, et\)/tests/test_mask\.py$''']
regexes = [
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NSJ9\.c2lnbmF0dXJlMTIz$''',
  '''^Q2xpZW50U2VjcmV0VmFsdWUxMjM0NTY3ODkwYWJjZA$''',
]
